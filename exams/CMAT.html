<script>
const TOPICS = [{"id": "qt-tabulation", "section": "qt", "title": "Tabulation", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Tabulation (Data Tables) Data Interpretation ka sabse common format hai jisme raw numbers ko rows aur columns mein organize kiya jata hai. CMAT mein aam taur par 1 table par 3–4 questions aate hain jo percentage change, ratio, average, aur total comparison check karte hain.", "examFocus": "Calculations exact karne ke bajaye approximation use karein. Row totals aur column totals ko rough sheet par ek hi baar likh lein taaki har sawal mein dobara add na karna pade.", "formulas": ["Percentage Change = ((New Value − Old Value) / Old Value) × 100", "A is what % of B = (A / B) × 100", "Average = Sum of Values / Number of Observations", "Ratio Comparison: Fractions ko cross-multiply karke jaldi compare karein (a/b vs c/d ⇒ compare ad vs bc)"], "examples": [{"q": "Ek company ki sales 2024 mein ₹400 Cr thi aur 2025 mein ₹520 Cr ho gayi. Percentage growth kitni rahi?", "steps": "Step 1: Growth = 520 − 400 = 120 Cr.\nStep 2: % Growth = (120 / 400) × 100 = 30%."}, {"q": "Table mein Dept A ke 4 quarters ki sales 40, 55, 65, aur 80 units hain. Average quarterly sales kya hai?", "steps": "Step 1: Total = 40 + 55 + 65 + 80 = 240.\nStep 2: Average = 240 / 4 = 60 units."}], "mcqs": [{"q": "Agar 2025 mein production 250 tonnes tha aur 2026 mein 300 tonnes ho gaya, toh percentage increase kitna hai?", "options": ["15%", "20%", "25%", "16.67%"], "ans": 1, "exp": "Increase = 300 − 250 = 50. % Increase = (50 / 250) × 100 = 20%."}, {"q": "Ek table mein Boys = 180 aur Girls = 120 hain. Girls total students ka kitna percent hain?", "options": ["35%", "40%", "45%", "66.6%"], "ans": 1, "exp": "Total = 180 + 120 = 300. Girls % = (120 / 300) × 100 = 40%."}, {"q": "4 zones ki sales ₹120L, ₹150L, ₹180L aur ₹150L hain. Average sales per zone kya hogi?", "options": ["₹145L", "₹150L", "₹155L", "₹160L"], "ans": 1, "exp": "Sum = 120 + 150 + 180 + 150 = 600. Average = 600 / 4 = ₹150L."}]}, {"id": "qt-mean-mode-median", "section": "qt", "title": "Mean, Mode, Median", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Ye Central Tendency ke teen basic measures hain. Mean (Average) sabhi values ka sum divided by count hota hai, Median sorted data ka beech wala number hota hai, aur Mode wo value hoti hai jo sabse zyada baar repeat hoti hai.", "examFocus": "Median nikalte waqt data ko ascending/descending order mein sort karna bilkul na bhoolein! CMAT mein empirical relation (Mode = 3 Median − 2 Mean) par direct formula question aata hai.", "formulas": ["Mean = (Sum of all observations) / n", "Median (odd n) = ((n + 1) / 2)th term after sorting", "Median (even n) = Average of (n/2)th and (n/2 + 1)th terms", "Empirical Relation: Mode = 3 × Median − 2 × Mean"], "examples": [{"q": "Data set {12, 5, 8, 19, 10} ka Median nikaalein.", "steps": "Step 1: Ascending order mein sort karein: 5, 8, 10, 12, 19.\nStep 2: n = 5 (odd), middle term = 3rd term = 10."}, {"q": "Agar kisi distribution ka Mean = 20 aur Median = 22 hai, toh empirical formula se Mode kya hoga?", "steps": "Step 1: Mode = 3(Median) − 2(Mean).\nStep 2: Mode = 3(22) − 2(20) = 66 − 40 = 26."}], "mcqs": [{"q": "Data {4, 7, 2, 7, 9, 4, 7, 1} ka Mode kya hai?", "options": ["4", "7", "2", "9"], "ans": 1, "exp": "Number 7 sabse zyada baar (3 times) repeat hua hai, isliye Mode = 7."}, {"q": "Data {10, 14, 18, 22, 26, 30} ka Median kya hoga?", "options": ["18", "20", "22", "21"], "ans": 1, "exp": "Data pehle se sorted hai (n = 6). Middle terms 18 aur 22 hain. Median = (18 + 22)/2 = 20."}, {"q": "Agar Mean = 30 aur Mode = 36 hai, toh Median kya hoga?", "options": ["31", "32", "33", "34"], "ans": 1, "exp": "Mode = 3 Median − 2 Mean ⇒ 36 = 3M − 60 ⇒ 3M = 96 ⇒ Median = 32."}]}, {"id": "qt-pipes-cisterns", "section": "qt", "title": "Pipes and Cisterns", "priority": "High", "expectedQs": "1 Q", "definition": "Ye Work and Time ka hi direct application hai. Inlet pipe tank ko bharta hai (positive work) aur Outlet/Leak pipe tank ko khali karta hai (negative work).", "examFocus": "Fraction method (1/A + 1/B) ke bajaye LCM method use karein: Total tank capacity = LCM of times, phir har pipe ki 1-hour efficiency nikaalein.", "formulas": ["Agar Pipe A tank ko x hrs mein bharta hai, toh 1 hr work = +1/x", "Agar Leak B tank ko y hrs mein khali karta hai, toh 1 hr work = −1/y", "Dono ek saath khulein toh fill time = (xy) / (y − x) (jab y > x)", "LCM Method: Total Capacity = LCM(x, y); Net Time = Capacity / Net Efficiency"], "examples": [{"q": "Pipe A ek tank ko 12 ghante mein aur Pipe B 15 ghante mein bharta hai. Dono milkar kitne ghante mein bharenge?", "steps": "Step 1: LCM(12, 15) = 60 units (Total Capacity).\nStep 2: Efficiency of A = 60/12 = 5 u/hr, B = 60/15 = 4 u/hr.\nStep 3: Combined = 9 u/hr ⇒ Time = 60/9 = 6.67 hrs (6 hrs 40 min)."}, {"q": "Pipe A tank ko 10 hr mein bharta hai aur Leak B 15 hr mein khali karta hai. Dono khulein toh tank kitne hr mein bharega?", "steps": "Step 1: LCM(10, 15) = 30 units.\nStep 2: A = +3 u/hr, B = −2 u/hr ⇒ Net = +1 u/hr.\nStep 3: Time = 30 / 1 = 30 hours."}], "mcqs": [{"q": "Pipe A tank ko 20 min mein aur Pipe B 30 min mein bharta hai. Dono ek saath kholne par kitna time lagega?", "options": ["10 min", "12 min", "15 min", "18 min"], "ans": 1, "exp": "LCM(20, 30) = 60. Efficiency = 3 + 2 = 5 u/min. Time = 60 / 5 = 12 min."}, {"q": "Ek inlet pipe 6 hr mein tank bharta hai, par leak ki wajah se 8 hr lagte hain. Leak akela bhare tank ko kitne hr mein khali karega?", "options": ["18 hr", "20 hr", "24 hr", "30 hr"], "ans": 2, "exp": "LCM(6, 8) = 24. Inlet = +4, Net = +3 ⇒ Leak = −1 u/hr. Time = 24 / 1 = 24 hr."}, {"q": "Pipe A 10 hr mein bharta hai, Pipe B 12 hr mein bharta hai, aur Outlet C 15 hr mein khali karta hai. Teeno khulein toh kitna time lagega?", "options": ["8 hr", "8.57 hr", "9 hr", "7.5 hr"], "ans": 1, "exp": "LCM(10, 12, 15) = 60. Net eff = 6 + 5 − 4 = 7 u/hr. Time = 60/7 ≈ 8.57 hr."}]}, {"id": "qt-si-ci", "section": "qt", "title": "Simple Interest & Compound Interest", "priority": "Very High", "expectedQs": "1-2 Qs", "definition": "Simple Interest (SI) har saal sirf original Principal par lagta hai, jabki Compound Interest (CI) mein har saal ka interest agle saal ke principal mein jud jata hai (interest on interest).", "examFocus": "2-year aur 3-year CI − SI difference formula CMAT mein baar-baar pucha jata hai. Effective rate shortcut (r + r + r²/100) se 2-year CI 10 second mein nikal jata hai.", "formulas": ["SI = (P × R × T) / 100 ; Amount = P + SI", "CI Amount = P × (1 + R/100)^T ; CI = Amount − P", "2-Year CI − SI Difference = P × (R / 100)²", "3-Year CI − SI Difference = P × (R / 100)² × (3 + R/100)", "Half-yearly compounding: Rate = R/2, Time = 2T"], "examples": [{"q": "₹10,000 par 10% p.a. ki rate se 2 saal ke CI aur SI ka difference kya hoga?", "steps": "Step 1: Formula = P × (R/100)².\nStep 2: 10000 × (10/100)² = 10000 × (1/100) = ₹100."}, {"q": "Koi sum Simple Interest par 8 saal mein double ho jata hai. Rate of interest kya hai?", "steps": "Step 1: Double hone ka matlab SI = P.\nStep 2: P = (P × R × 8) / 100 ⇒ R = 100 / 8 = 12.5%."}], "mcqs": [{"q": "₹5,000 par 8% p.a. ki rate se 3 saal ka Simple Interest kya hoga?", "options": ["₹1,000", "₹1,200", "₹1,400", "₹1,500"], "ans": 1, "exp": "SI = (5000 × 8 × 3) / 100 = ₹1,200."}, {"q": "₹8,000 par 10% p.a. compounded annually se 2 saal baad Amount kitna hoga?", "options": ["₹9,600", "₹9,680", "₹9,800", "₹9,480"], "ans": 1, "exp": "Amount = 8000 × (1.1)² = 8000 × 1.21 = ₹9,680."}, {"q": "Agar 2 saal ka CI − SI difference 5% rate par ₹25 hai, toh Principal kya hai?", "options": ["₹8,000", "₹10,000", "₹12,000", "₹5,000"], "ans": 1, "exp": "25 = P × (5/100)² = P / 400 ⇒ P = ₹10,000."}]}, {"id": "qt-geometry", "section": "qt", "title": "Geometry", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Geometry mein Lines & Angles, Triangles (Pythagoras, Similarity), Circles (Chords, Tangents, Cyclic Quadrilaterals), aur Polygons ke properties par direct questions aate hain.", "examFocus": "Heavy proofs nahi aate—bas standard Pythagorean triplets (3-4-5, 5-12-13, 8-15-17), triangle angle sum (180°), aur polygon interior angle formulas yaad rakhein.", "formulas": ["Sum of interior angles of n-sided polygon = (n − 2) × 180°", "Each exterior angle of regular n-gon = 360° / n", "Pythagoras: a² + b² = c² (Triplets: 3-4-5, 5-12-13, 7-24-25, 8-15-17)", "Angle in a semicircle = 90°; Opposite angles of cyclic quadrilateral sum to 180°"], "examples": [{"q": "Ek regular octagon (8 sides) ke har interior angle ka measure kya hoga?", "steps": "Step 1: Exterior angle = 360° / 8 = 45°.\nStep 2: Interior angle = 180° − 45° = 135°."}, {"q": "Right-angled triangle ke dono legs 5 cm aur 12 cm hain. Hypotenuse ki length kya hogi?", "steps": "Step 1: c = √(5² + 12²) = √(25 + 144) = √169 = 13 cm."}], "mcqs": [{"q": "Ek regular hexagon (6 sides) ke sabhi interior angles ka sum kitna hota hai?", "options": ["540°", "720°", "900°", "360°"], "ans": 1, "exp": "Sum = (n − 2) × 180° = (6 − 2) × 180° = 720°."}, {"q": "Agar triangle ke angles 2:3:4 ratio mein hain, toh sabse bada angle kya hoga?", "options": ["60°", "80°", "90°", "100°"], "ans": 1, "exp": "2x + 3x + 4x = 180° ⇒ 9x = 180° ⇒ x = 20°. Largest = 4x = 80°."}, {"q": "Ek cyclic quadrilateral ABCD mein agar Angle A = 75° hai, toh opposite Angle C kitna hoga?", "options": ["75°", "95°", "105°", "115°"], "ans": 2, "exp": "Opposite angles of a cyclic quadrilateral sum to 180° ⇒ C = 180° − 75° = 105°."}]}, {"id": "qt-probability", "section": "qt", "title": "Probability", "priority": "High", "expectedQs": "1 Q", "definition": "Probability kisi event ke hone ka chance batati hai (0 se 1 ke beech). CMAT mein coins, dice, playing cards (52 cards), aur colored balls nikalne par straightforward questions aate hain.", "examFocus": "'At least one' wale questions hamesha complement rule `1 − P(none)` se solve karein—ye 3x faster hota hai.", "formulas": ["P(E) = Favourable Outcomes / Total Outcomes (0 ≤ P(E) ≤ 1)", "P(Not E) = 1 − P(E)", "Independent Events: P(A and B) = P(A) × P(B)", "Mutually Exclusive: P(A or B) = P(A) + P(B)", "Deck of 52 cards: 4 suits (13 each), 26 red, 26 black, 12 face cards (J, Q, K)"], "examples": [{"q": "Do fair dice ek saath throw kiye jaate hain. Sum = 9 aane ki probability kya hai?", "steps": "Step 1: Total outcomes = 6 × 6 = 36.\nStep 2: Favourable pairs for sum 9: (3,6), (4,5), (5,4), (6,3) = 4.\nStep 3: P = 4 / 36 = 1/9."}, {"q": "52 cards ke pack se 1 card draw kiya gaya. King ya Queen hone ki probability kya hai?", "steps": "Step 1: 4 Kings + 4 Queens = 8 favourable cards.\nStep 2: P = 8 / 52 = 2/13."}], "mcqs": [{"q": "Ek bag mein 4 red aur 6 blue balls hain. Random 1 ball nikalne par red hone ki probability kya hai?", "options": ["2/5", "3/5", "1/4", "4/6"], "ans": 0, "exp": "Total = 10 balls, Red = 4 ⇒ P = 4/10 = 2/5."}, {"q": "Teen fair coins ek saath toss kiye jaate hain. Kam se kam 1 Head aane ki probability kya hai?", "options": ["1/8", "3/8", "7/8", "1/2"], "ans": 2, "exp": "P(at least 1 Head) = 1 − P(all Tails) = 1 − (1/8) = 7/8."}, {"q": "52 cards ke pack se 1 card nikalne par wo Red Face Card hone ki probability kya hai?", "options": ["3/26", "6/26", "1/13", "3/13"], "ans": 0, "exp": "Red suits (Hearts, Diamonds) mein 3 + 3 = 6 face cards hote hain. P = 6/52 = 3/26."}]}, {"id": "qt-tsd", "section": "qt", "title": "Time-Speed-Distance", "priority": "Very High", "expectedQs": "1-2 Qs", "definition": "TSD mein Speed = Distance / Time ke alawa Relative Speed (trains crossing), Average Speed, aur Boats & Streams par CMAT mein har saal 1–2 questions pakke aate hain.", "examFocus": "Unit conversion (km/hr ↔ m/s) mein bilkul galti na karein: km/hr se m/s ke liye × 5/18, aur m/s se km/hr ke liye × 18/5.", "formulas": ["Distance = Speed × Time", "km/hr to m/s: multiply by 5/18 | m/s to km/hr: multiply by 18/5", "Average Speed (equal distances at speeds x, y) = 2xy / (x + y)", "Relative Speed: Opposite direction = S1 + S2 | Same direction = |S1 − S2|", "Boats: Downstream = B + S | Upstream = B − S"], "examples": [{"q": "Ek car A se B 40 km/hr se jati hai aur 60 km/hr se wapas aati hai. Average speed kya hai?", "steps": "Step 1: Equal distances ⇒ Avg Speed = 2xy / (x + y).\nStep 2: (2 × 40 × 60) / (40 + 60) = 4800 / 100 = 48 km/hr."}, {"q": "180m lambi train 72 km/hr ki speed se ek electric pole ko kitne seconds mein cross karegi?", "steps": "Step 1: Speed in m/s = 72 × (5/18) = 20 m/s.\nStep 2: Time = Distance / Speed = 180 / 20 = 9 seconds."}], "mcqs": [{"q": "90 km/hr ko m/s mein convert karein.", "options": ["20 m/s", "25 m/s", "30 m/s", "18 m/s"], "ans": 1, "exp": "90 × (5/18) = 25 m/s."}, {"q": "Ek boat still water mein 12 km/hr chalti hai aur stream speed 3 km/hr hai. 45 km downstream jaane mein kitna time lagega?", "options": ["3 hrs", "4 hrs", "5 hrs", "2.5 hrs"], "ans": 0, "exp": "Downstream speed = 12 + 3 = 15 km/hr. Time = 45 / 15 = 3 hrs."}, {"q": "200m lambi train 54 km/hr se 250m lambe platform ko kitne second mein cross karegi?", "options": ["20 sec", "25 sec", "30 sec", "35 sec"], "ans": 2, "exp": "Total distance = 200 + 250 = 450m. Speed = 54 × 5/18 = 15 m/s. Time = 450/15 = 30 sec."}]}, {"id": "qt-profit-loss", "section": "qt", "title": "Profit and Loss", "priority": "Very High", "expectedQs": "1-2 Qs", "definition": "Cost Price (CP), Selling Price (SP), Marked Price (MP), Discount, aur Dishonest Shopkeeper wale sawal CMAT Arithmetic ka sabse high-frequency hissa hain.", "examFocus": "Hamesha yaad rakhein: Profit/Loss % CP par calculate hota hai, jabki Discount % Marked Price (MP) par calculate hota hai.", "formulas": ["Profit % = ((SP − CP) / CP) × 100 | Loss % = ((CP − SP) / CP) × 100", "SP = CP × (1 + P/100) = MP × (1 − D/100)", "Successive discounts d1%, d2%: Net Discount = d1 + d2 − (d1×d2)/100", "Same SP par ek item +x% profit aur dusra −x% loss ⇒ Always Loss of (x² / 100)%"], "examples": [{"q": "Ek item ₹800 mein kharid kar ₹960 mein becha gaya. Profit % kitna hua?", "steps": "Step 1: Profit = 960 − 800 = ₹160.\nStep 2: Profit % = (160 / 800) × 100 = 20%."}, {"q": "20% aur 10% ke do successive discounts ka single equivalent discount kya hoga?", "steps": "Step 1: Net Discount = 20 + 10 − (20 × 10)/100 = 30 − 2 = 28%."}], "mcqs": [{"q": "Agar SP = ₹600 aur Profit = 20% hai, toh CP kya tha?", "options": ["₹480", "₹500", "₹520", "₹540"], "ans": 1, "exp": "CP = 600 / 1.20 = ₹500."}, {"q": "Do phones ₹10,000 each mein beche gaye: ek par 10% profit, dusre par 10% loss. Overall result kya hai?", "options": ["No profit no loss", "1% profit", "1% loss", "2% loss"], "ans": 2, "exp": "Same SP par ±x% hone par hamesha (x²/100)% loss hota hai ⇒ 10²/100 = 1% loss."}, {"q": "Marked Price ₹1,500 par 15% discount dene ke baad Selling Price kya hoga?", "options": ["₹1,250", "₹1,275", "₹1,300", "₹1,325"], "ans": 1, "exp": "SP = 1500 × 0.85 = ₹1,275."}]}, {"id": "qt-pnc", "section": "qt", "title": "Permutations & Combinations", "priority": "High", "expectedQs": "1 Q", "definition": "Permutation ka matlab Arrangement (jahan order matter karta hai, e.g., passwords, seating) aur Combination ka matlab Selection (jahan order matter nahi karta, e.g., committee banana).", "examFocus": "Pehle ye pehchanein ki sawal mein 'arrange' karna hai (nPr) ya sirf 'select' karna hai (nCr). Word-arrangement questions mein repeated letters ke factorial se divide karna na bhoolein.", "formulas": ["nPr = n! / (n − r)! (Arrangement)", "nCr = n! / (r! (n − r)!) (Selection)", "Circular arrangement of n distinct items = (n − 1)!", "Words with repeated letters = n! / (p! × q! ...)"], "examples": [{"q": "Word 'APPLE' ke letters ko kitne distinct ways mein arrange kiya ja sakta hai?", "steps": "Step 1: Total letters = 5; 'P' 2 baar repeat hua hai.\nStep 2: Ways = 5! / 2! = 120 / 2 = 60 ways."}, {"q": "6 students mein se 3 students ki committee kitne ways mein select ki ja sakti hai?", "steps": "Step 1: Selection ⇒ 6C3 = (6 × 5 × 4) / (3 × 2 × 1) = 20 ways."}], "mcqs": [{"q": "5 friends ek circular table ke around kitne ways mein baith sakte hain?", "options": ["120", "24", "60", "12"], "ans": 1, "exp": "Circular permutation = (n − 1)! = 4! = 24."}, {"q": "Digits 1, 2, 3, 4 se bina repetition kitne 3-digit numbers ban sakte hain?", "options": ["12", "24", "64", "16"], "ans": 1, "exp": "4P3 = 4 × 3 × 2 = 24."}, {"q": "8 players mein se 2 captains kitne ways mein select ho sakte hain?", "options": ["16", "28", "56", "64"], "ans": 1, "exp": "8C2 = (8 × 7) / 2 = 28."}]}, {"id": "qt-percentages", "section": "qt", "title": "Percentages", "priority": "Very High", "expectedQs": "1-2 Qs", "definition": "Percentages poore Arithmetic aur DI ki foundation hai. Fraction-to-percentage table yaad rakhne se aapki calculation speed double ho jati hai.", "examFocus": "Successive percentage change (`a + b + ab/100`) aur price-consumption inverse rule (`x / (100+x) × 100`) par CMAT mein direct sawal aate hain.", "formulas": ["Key Fractions: 1/3=33.33%, 1/6=16.67%, 1/7=14.28%, 1/8=12.5%, 1/9=11.11%, 1/12=8.33%", "Successive % change: a + b + (a × b) / 100", "Agar A, B se x% zyada hai, toh B, A se [x / (100 + x)] × 100 % kam hai"], "examples": [{"q": "Agar petrol ka price 25% badh jaye, toh consumption kitna % kam karein taaki kharcha same rahe?", "steps": "Step 1: Formula = [25 / (100 + 25)] × 100 = (25 / 125) × 100 = 20%."}, {"q": "Ek number ko pehle 20% badhaya aur phir 20% ghataya gaya. Net % change kya hai?", "steps": "Step 1: Net = +20 − 20 + (20 × −20)/100 = −4% (4% decrease)."}], "mcqs": [{"q": "360 ka 12.5% kitna hota hai?", "options": ["40", "45", "48", "50"], "ans": 1, "exp": "12.5% = 1/8 ⇒ 360 / 8 = 45."}, {"q": "Agar salary pehle 10% badhe aur phir 20% badhe, toh total % increase kya hoga?", "options": ["30%", "32%", "31%", "28%"], "ans": 1, "exp": "10 + 20 + (10×20)/100 = 32%."}, {"q": "Ek exam mein pass hone ke liye 40% chahiye. Student ko 140 marks mile aur wo 20 marks se fail hua. Max marks kya hain?", "options": ["350", "400", "450", "500"], "ans": 1, "exp": "Pass marks = 140 + 20 = 160 = 40% ⇒ Total = 160 / 0.4 = 400."}]}, {"id": "qt-inequations", "section": "qt", "title": "In-equations", "priority": "Medium", "expectedQs": "1 Q", "definition": "In-equations (Inequalities) mein `= ` ki jagah `<, >, ≤, ≥` signs hote hain aur hume variable `x` ki valid range nikalni hoti hai.", "examFocus": "Sabse bada trap: Jab bhi inequality ke dono sides ko kisi NEGATIVE number se multiply ya divide karein, inequality sign FLIP ho jata hai!", "formulas": ["Agar a > b aur c < 0, toh ac < bc (sign flips)", "|x| < a ⇒ −a < x < a", "|x| > a ⇒ x < −a OR x > a", "Quadratic (x − a)(x − b) < 0 (a < b) ⇒ a < x < b"], "examples": [{"q": "Solve: 3x − 7 > 5.", "steps": "Step 1: 3x > 12.\nStep 2: x > 4."}, {"q": "Solve: (x − 2)(x − 5) < 0.", "steps": "Step 1: Roots are 2 and 5.\nStep 2: Negative product lies between the roots ⇒ 2 < x < 5."}], "mcqs": [{"q": "Solve for x: −2x + 6 ≥ 10.", "options": ["x ≥ −2", "x ≤ −2", "x ≥ 2", "x ≤ 2"], "ans": 1, "exp": "−2x ≥ 4 ⇒ divide by −2 (sign flips) ⇒ x ≤ −2."}, {"q": "|x − 3| < 5 ke liye integer solutions kitne honge?", "options": ["7", "8", "9", "10"], "ans": 2, "exp": "−5 < x − 3 < 5 ⇒ −2 < x < 8 ⇒ Integers: −1, 0, 1, 2, 3, 4, 5, 6, 7 (total 9)."}, {"q": "x² − 9 ≤ 0 ki range kya hai?", "options": ["x ≤ 3", "−3 ≤ x ≤ 3", "x ≥ −3", "x ≤ −3 or x ≥ 3"], "ans": 1, "exp": "(x − 3)(x + 3) ≤ 0 ⇒ −3 ≤ x ≤ 3."}]}, {"id": "qt-equations", "section": "qt", "title": "Quadratic & Linear Equations", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Linear equations (ax + by = c) aur Quadratic equations (ax² + bx + c = 0) par age problems, digit problems, aur roots ka sum/product CMAT mein aksar aate hain.", "examFocus": "Quadratic ke roots nikalne ki jagah options substitute karke ya Sum/Product of roots (`−b/a`, `c/a`) se sawal 15 seconds mein solve ho jata hai.", "formulas": ["Quadratic Formula: x = [−b ± √(b² − 4ac)] / 2a", "Discriminant D = b² − 4ac (D > 0 real & distinct, D = 0 equal, D < 0 imaginary)", "Sum of roots (α + β) = −b / a | Product of roots (αβ) = c / a", "Linear system consistency: a1/a2 = b1/b2 ≠ c1/c2 ⇒ No solution"], "examples": [{"q": "Equation x² − 7x + 12 = 0 ke roots kya hain?", "steps": "Step 1: Factorize: (x − 3)(x − 4) = 0.\nStep 2: x = 3, 4."}, {"q": "2x² − 8x + 6 = 0 ke roots ka sum aur product nikaalein.", "steps": "Step 1: Sum = −(−8)/2 = 4.\nStep 2: Product = 6/2 = 3."}], "mcqs": [{"q": "Agar x² − kx + 9 = 0 ke dono roots equal hain, toh positive k ki value kya hogi?", "options": ["3", "6", "9", "12"], "ans": 1, "exp": "Equal roots ⇒ D = 0 ⇒ k² − 4(1)(9) = 0 ⇒ k² = 36 ⇒ k = 6."}, {"q": "2x + 3y = 13 aur x − y = 4 ho, toh x ki value kya hai?", "options": ["3", "4", "5", "6"], "ans": 2, "exp": "y = x − 4 ⇒ 2x + 3(x − 4) = 13 ⇒ 5x = 25 ⇒ x = 5."}, {"q": "3x² − 12x + 9 = 0 ke roots ka sum kitna hai?", "options": ["3", "4", "−4", "12"], "ans": 1, "exp": "Sum = −b/a = 12/3 = 4."}]}, {"id": "qt-line-graph", "section": "qt", "title": "Line Graph", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Line Graph time ke saath trends (revenue, profit %, imports/exports) dikhata hai. Har point par Y-axis ki value aur slope (rate of change) check karni hoti hai.", "examFocus": "Line steepest jahan ho wahan absolute change sabse zyada hota hai, par percentage change ke liye base (previous year value) zaroor check karein!", "formulas": ["Steepest upward line = Highest absolute increase", "Profit % = ((Income − Expenditure) / Expenditure) × 100", "Income = Expenditure × (1 + Profit%/100)"], "examples": [{"q": "Line graph mein Expenditure ₹50 Cr aur Profit 20% hai. Income kitni hogi?", "steps": "Step 1: Income = 50 × (1 + 20/100) = 50 × 1.2 = ₹60 Cr."}, {"q": "2023 mein value 80 thi aur 2024 mein 100; 2024 se 2025 mein 120. Kis saal % growth zyada thi?", "steps": "Step 1: 2023–24: (20/80)×100 = 25%.\nStep 2: 2024–25: (20/100)×100 = 20%. ⇒ 2023–24 higher."}], "mcqs": [{"q": "Agar Income = ₹75 Cr aur Profit = 25% (on Expenditure) hai, toh Expenditure kya hai?", "options": ["₹55 Cr", "₹60 Cr", "₹62.5 Cr", "₹50 Cr"], "ans": 1, "exp": "Expenditure = 75 / 1.25 = ₹60 Cr."}, {"q": "Line graph par 2022–2025 ke data points 20, 30, 45, 65 hain. Maximum absolute jump kis period mein hua?", "options": ["2022–23", "2023–24", "2024–25", "Sab equal"], "ans": 2, "exp": "Jumps: +10, +15, +20. Max jump 2024–25 mein (+20)."}, {"q": "Upar wale data (20, 30, 45, 65) mein highest percentage jump kis period mein tha?", "options": ["2022–23 (50%)", "2023–24 (50%)", "2024–25 (44.4%)", "Both A and B"], "ans": 3, "exp": "20→30 is 50%, 30→45 is 50%, 45→65 is 44.4%. Both A & B tied at 50%."}]}, {"id": "qt-mensuration", "section": "qt", "title": "Mensuration", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "2D shapes (Circle, Rectangle, Triangle, Trapezium) ka Area/Perimeter aur 3D solids (Cube, Cuboid, Cylinder, Cone, Sphere) ka Volume aur Surface Area.", "examFocus": "Melting & recasting questions mein hamesha Volume constant rehta hai. π = 22/7 use karke options mein 11 ka multiple check karna super fast trick hai.", "formulas": ["Circle: Area = πr², Circumference = 2πr", "Cylinder: Volume = πr²h, CSA = 2πrh, TSA = 2πr(r + h)", "Cone: Volume = (1/3)πr²h, CSA = πrl (l = √(r²+h²))", "Sphere: Volume = (4/3)πr³, Surface Area = 4πr²", "Cube: Volume = a³, TSA = 6a², Diagonal = a√3"], "examples": [{"q": "7 cm radius aur 10 cm height wale cylinder ka volume kya hoga? (π = 22/7)", "steps": "Step 1: V = πr²h = (22/7) × 7 × 7 × 10 = 1540 cm³."}, {"q": "Agar ek square ki side 10% badha di jaye, toh uska area kitna % badhega?", "steps": "Step 1: Successive % = 10 + 10 + (10×10)/100 = 21%."}], "mcqs": [{"q": "4 cm edge wale cube ka Total Surface Area kya hoga?", "options": ["64 cm²", "96 cm²", "48 cm²", "128 cm²"], "ans": 1, "exp": "TSA = 6a² = 6 × 16 = 96 cm²."}, {"q": "14 cm radius wale circle ka area kya hoga? (π = 22/7)", "options": ["308 cm²", "616 cm²", "154 cm²", "462 cm²"], "ans": 1, "exp": "Area = (22/7) × 14 × 14 = 616 cm²."}, {"q": "Agar sphere ka radius double kar diya jaye, toh volume kitne guna ho jayega?", "options": ["2 times", "4 times", "6 times", "8 times"], "ans": 3, "exp": "V ∝ r³ ⇒ (2r)³ = 8r³, so 8 times."}]}, {"id": "qt-alligation-mixtures", "section": "qt", "title": "Alligation & Mixtures", "priority": "Very High", "expectedQs": "1 Q", "definition": "Jab do alag price ya concentration wali cheezon ko milakar ek mean value banayi jati hai, toh unka mixing ratio nikalne ke liye Alligation rule use hota hai.", "examFocus": "Replacement formula (`Final = Initial × (1 − x/V)^n`) aur criss-cross Alligation diagram zaroor practice karein—ye averages aur profit-loss mein bhi lagta hai.", "formulas": ["Alligation Rule: Quantity(Cheaper) / Quantity(Dearer) = (Dearer − Mean) / (Mean − Cheaper)", "Repeated Replacement: Pure left = V × (1 − x / V)^n"], "examples": [{"q": "₹40/kg aur ₹60/kg ki chai kis ratio mein milayein ki mixture ₹48/kg ka bane?", "steps": "Step 1: Cheaper/Dearer = (60 − 48) / (48 − 40) = 12 / 8 = 3 : 2."}, {"q": "40 L pure milk se 4 L nikal kar paani dala gaya, aur ye process 2 baar hua. Kitna pure milk bacha?", "steps": "Step 1: Final = 40 × (1 − 4/40)² = 40 × (0.9)² = 40 × 0.81 = 32.4 L."}], "mcqs": [{"q": "₹30/L aur ₹50/L ke do liquids ko kis ratio mein milayein ki average ₹35/L ho?", "options": ["3 : 1", "1 : 3", "2 : 1", "3 : 2"], "ans": 0, "exp": "(50 − 35) : (35 − 30) = 15 : 5 = 3 : 1."}, {"q": "60 L milk-water mixture mein ratio 2:1 hai. Kitna paani add karein ki ratio 1:2 ho jaye?", "options": ["40 L", "50 L", "60 L", "30 L"], "ans": 2, "exp": "Initially Milk = 40L, Water = 20L. For 1:2, Water must be 80L ⇒ add 60L."}, {"q": "20% aur 50% alcohol solutions ko equal quantity mein milane par concentration kya hogi?", "options": ["30%", "35%", "40%", "32%"], "ans": 1, "exp": "Equal quantity ⇒ simple average = (20 + 50)/2 = 35%."}]}, {"id": "qt-number-system", "section": "qt", "title": "Number System", "priority": "Medium", "expectedQs": "1-3 Qs", "definition": "Divisibility rules, HCF & LCM, Unit Digit cyclicity, Remainders, aur Prime/Composite numbers is chapter ke core topics hain.", "examFocus": "CMAT mein CAT jitna deep Number Theory nahi aata—HCF×LCM = Product of two numbers, divisibility by 3/9/11, aur Unit Digit cyclicity (power mod 4) sabse zyada pucha jata hai.", "formulas": ["HCF × LCM = Product of two numbers", "Divisibility: 3/9 (sum of digits), 4 (last 2 digits), 8 (last 3 digits), 11 (alt digit sum diff = 0 or 11)", "Sum of first n natural numbers = n(n + 1)/2", "Unit digit of a^n: divide n by 4 and check remainder (if rem=0, take power 4)"], "examples": [{"q": "7^25 ka unit digit kya hoga?", "steps": "Step 1: 7 ki cyclicity 4 hoti hai (7, 9, 3, 1).\nStep 2: 25 ÷ 4 leaves remainder 1 ⇒ 7^1 = 7."}, {"q": "Do numbers ka HCF 6 aur LCM 72 hai. Agar ek number 18 hai, toh dusra kya hoga?", "steps": "Step 1: 18 × x = 6 × 72 = 432 ⇒ x = 24."}], "mcqs": [{"q": "2^33 ka unit digit kya hoga?", "options": ["2", "4", "6", "8"], "ans": 0, "exp": "33 ÷ 4 gives remainder 1 ⇒ 2^1 = 2."}, {"q": "Pehle 20 natural numbers (1 se 20) ka sum kitna hota hai?", "options": ["190", "200", "210", "220"], "ans": 2, "exp": "n(n+1)/2 = 20 × 21 / 2 = 210."}, {"q": "Agar number 5432*7, 9 se divisible hai, toh * ki jagah kya digit aayega?", "options": ["3", "6", "9", "0"], "ans": 1, "exp": "Sum of digits = 5+4+3+2+7 = 21. Next multiple of 9 is 27 ⇒ * = 6."}]}, {"id": "qt-algebra", "section": "qt", "title": "Algebra", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Algebraic identities, Surds & Indices, Logarithms, aur Arithmetic/Geometric Progressions (AP/GP) is section mein cover hote hain.", "examFocus": "Standard identities (a+b)², (a+b)³, a³+b³, aur `x + 1/x` shortcuts yaad rakhein. Value-putting (x = 1 ya 2 daal kar check karna) se complex expressions jaldi solve hote hain.", "formulas": ["(a + b)² = a² + 2ab + b² | a² − b² = (a − b)(a + b)", "Agar x + 1/x = k, toh x² + 1/x² = k² − 2 aur x³ + 1/x³ = k³ − 3k", "AP: nth term = a + (n−1)d ; Sum = (n/2)[2a + (n−1)d]", "GP: nth term = a·r^(n−1) ; Infinite sum (|r|<1) = a / (1 − r)"], "examples": [{"q": "Agar x + 1/x = 5 hai, toh x² + 1/x² ki value kya hogi?", "steps": "Step 1: Formula = k² − 2 = 5² − 2 = 25 − 2 = 23."}, {"q": "AP: 3, 7, 11, 15... ka 10th term kya hoga?", "steps": "Step 1: a = 3, d = 4, n = 10.\nStep 2: T10 = 3 + 9(4) = 39."}], "mcqs": [{"q": "Agar x + 1/x = 3 hai, toh x³ + 1/x³ kya hoga?", "options": ["18", "27", "21", "15"], "ans": 0, "exp": "k³ − 3k = 27 − 9 = 18."}, {"q": "AP 5, 8, 11... ka 15th term kya hoga?", "options": ["44", "47", "50", "42"], "ans": 1, "exp": "a + 14d = 5 + 14(3) = 47."}, {"q": "Agar a + b = 7 aur ab = 10, toh a² + b² kya hoga?", "options": ["29", "39", "49", "19"], "ans": 0, "exp": "a² + b² = (a+b)² − 2ab = 49 − 20 = 29."}]}, {"id": "qt-work-time", "section": "qt", "title": "Work and Time", "priority": "Very High", "expectedQs": "1-2 Qs", "definition": "Isme log ya machines milkar koi kaam kitne din mein complete karenge aur wages kis ratio mein bantenge, ye calculate hota hai.", "examFocus": "LCM method aur MDH formula (`M1 D1 H1 / W1 = M2 D2 H2 / W2`) se 95% Work & Time questions 30 second mein solve ho jaate hain.", "formulas": ["Work = Efficiency × Time (Efficiency ∝ 1 / Time)", "Chain Rule: (M1 × D1 × H1) / W1 = (M2 × D2 × H2) / W2", "Wages are always divided in the ratio of Work Done (or Efficiency if time is equal)"], "examples": [{"q": "A ek kaam 10 din mein aur B 15 din mein karta hai. Dono milkar kitne din mein karenge?", "steps": "Step 1: LCM(10, 15) = 30 units.\nStep 2: A = 3 u/day, B = 2 u/day ⇒ Combined = 5 u/day.\nStep 3: Time = 30 / 5 = 6 days."}, {"q": "12 men ek kaam 10 din mein karte hain. 15 men wahi kaam kitne din mein karenge?", "steps": "Step 1: M1 × D1 = M2 × D2 ⇒ 12 × 10 = 15 × D2 ⇒ D2 = 8 days."}], "mcqs": [{"q": "A 12 din mein aur B 24 din mein kaam karta hai. Dono milkar kitne din mein complete karenge?", "options": ["6 days", "8 days", "9 days", "10 days"], "ans": 1, "exp": "LCM = 24. Eff = 2 + 1 = 3. Time = 24 / 3 = 8 days."}, {"q": "20 workers 6 ghante roz kaam karke 12 din mein wall banate hain. 15 workers 8 ghante roz kaam karke kitne din mein banayenge?", "options": ["10 days", "12 days", "14 days", "15 days"], "ans": 1, "exp": "20 × 6 × 12 = 15 × 8 × D ⇒ 1440 = 120 D ⇒ D = 12 days."}, {"q": "A ki efficiency B se double hai. Dono milkar kaam 12 din mein karte hain, toh A akela kitne din mein karega?", "options": ["16 days", "18 days", "20 days", "24 days"], "ans": 1, "exp": "Eff A:B = 2:1 ⇒ Total eff = 3. Total work = 3 × 12 = 36. A alone = 36 / 2 = 18 days."}]}, {"id": "qt-binomial", "section": "qt", "title": "Binomial Theorem", "priority": "Medium", "expectedQs": "0-1 Q", "definition": "Binomial Theorem `(a + b)^n` ko expand karne aur usme total terms, middle term, ya kisi specific term ka coefficient nikalne ke liye use hota hai.", "examFocus": "CMAT mein ye rarely aata hai—sirf 3 basic formulas (Number of terms = n+1, General term, aur Sum of coefficients = 2^n) yaad rakhna kaafi hai.", "formulas": ["Number of terms in (a + b)^n = n + 1", "General (r+1)th term: T(r+1) = nCr × a^(n−r) × b^r", "Sum of all binomial coefficients (nC0 + nC1 + ... + nCn) = 2^n", "Middle term (even n) = (n/2 + 1)th term"], "examples": [{"q": "(x + y)^7 ke expansion mein total kitne terms honge?", "steps": "Step 1: Number of terms = n + 1 = 7 + 1 = 8 terms."}, {"q": "(1 + x)^5 ke sabhi binomial coefficients ka sum kya hoga?", "steps": "Step 1: Put x = 1 ⇒ (1 + 1)^5 = 2^5 = 32."}], "mcqs": [{"q": "(2x + 3y)^10 ke expansion mein total kitne terms honge?", "options": ["10", "11", "12", "20"], "ans": 1, "exp": "Total terms = n + 1 = 10 + 1 = 11."}, {"q": "(1 + x)^6 mein x² ka coefficient kya hoga?", "options": ["10", "15", "20", "6"], "ans": 1, "exp": "6C2 = (6 × 5) / 2 = 15."}, {"q": "(1 + x)^4 ke sabhi coefficients ka sum kitna hota hai?", "options": ["8", "12", "16", "32"], "ans": 2, "exp": "2^4 = 16."}]}, {"id": "qt-pie-bar", "section": "qt", "title": "Pie Chart, Bar Chart", "priority": "High", "expectedQs": "2-3 Qs", "definition": "Pie Chart total (100% ya 360°) ka sector-wise distribution dikhata hai, aur Bar Chart categories ke beech height/value comparison dikhata hai.", "examFocus": "Pie chart mein percentage-to-degree conversion (`1% = 3.6°`) aur direct ratio comparison (bina total value multiply kiye!) se kaafi time bachta hai.", "formulas": ["Full Pie Chart = 100% = 360° ⇒ 1% = 3.6° and 10% = 36°", "Sector Angle = (Sector Value / Total Value) × 360°", "Ratio of two sectors = Ratio of their percentages (Total multiply karne ki zaroorat nahi!)"], "examples": [{"q": "Ek Pie Chart mein Education par 25% kharcha hai. Iska central angle kitne degree hoga?", "steps": "Step 1: 25 × 3.6° = 90°."}, {"q": "Total budget ₹2,00,000 mein Rent 30% aur Food 20% hai. Rent aur Food ka difference kitna hai?", "steps": "Step 1: % diff = 30% − 20% = 10%.\nStep 2: 10% of 2,00,000 = ₹20,000."}], "mcqs": [{"q": "Pie chart mein 72° ka sector total ka kitna percentage darshata hai?", "options": ["15%", "20%", "25%", "18%"], "ans": 1, "exp": "(72 / 360) × 100 = 20%."}, {"q": "Agar Pie Chart mein A = 18% aur B = 27% hai, toh A : B ka ratio kya hoga?", "options": ["1 : 2", "2 : 3", "3 : 4", "2 : 5"], "ans": 1, "exp": "18 : 27 = 2 : 3."}, {"q": "Bar chart mein Sales 2024 = 400 aur 2025 = 500 hai. 2025 ki sales 2024 se kitna % zyada hai?", "options": ["20%", "25%", "30%", "15%"], "ans": 1, "exp": "(100 / 400) × 100 = 25%."}]}, {"id": "qt-ratio-proportion", "section": "qt", "title": "Ratio and Proportion", "priority": "Very High", "expectedQs": "1-2 Qs", "definition": "Ratio do similar quantities ka comparison (a:b) hai, aur Proportion do equal ratios (a:b :: c:d) ko dikhata hai. Partnership aur Age problems bhi isi par based hote hain.", "examFocus": "Combining ratios (`A:B` aur `B:C` se `A:B:C`) aur Partnership profit sharing (`Profit ∝ Investment × Time`) CMAT mein baar-baar aate hain.", "formulas": ["If a : b :: c : d, then a × d = b × c", "Mean proportional between a and b = √(ab)", "Third proportional to a and b = b² / a", "Partnership Profit Ratio = (Investment1 × Time1) : (Investment2 × Time2)"], "examples": [{"q": "Agar A : B = 2 : 3 aur B : C = 4 : 5 hai, toh A : B : C kya hoga?", "steps": "Step 1: B ko common (12) banayein ⇒ A:B = 8:12, B:C = 12:15.\nStep 2: A : B : C = 8 : 12 : 15."}, {"q": "₹1,200 ko A aur B mein 3 : 5 ke ratio mein baantein. B ka share kya hoga?", "steps": "Step 1: Total parts = 3 + 5 = 8.\nStep 2: B's share = (5 / 8) × 1200 = ₹750."}], "mcqs": [{"q": "4 aur 16 ka Mean Proportional kya hai?", "options": ["6", "8", "10", "12"], "ans": 1, "exp": "√(4 × 16) = √64 = 8."}, {"q": "A ne ₹20,000 6 mahine ke liye aur B ne ₹15,000 8 mahine ke liye invest kiye. Unke profit ka ratio kya hoga?", "options": ["1 : 1", "4 : 3", "3 : 4", "2 : 3"], "ans": 0, "exp": "(20000 × 6) : (15000 × 8) = 120000 : 120000 = 1 : 1."}, {"q": "Agar 3 : 5 :: x : 25 hai, toh x ki value kya hogi?", "options": ["12", "15", "18", "20"], "ans": 1, "exp": "5x = 75 ⇒ x = 15."}]}, {"id": "lr-analytical", "section": "lr", "title": "Analytical Reasoning", "priority": "Very High", "expectedQs": "2-3 Qs", "definition": "Analytical Reasoning mein multi-condition puzzles aate hain jahan aapko clues ko combine karke exact order, grouping, ya pairing nikalni hoti hai.", "examFocus": "Hamesha definite clues (fixed positions) se start karein aur negative clues ('A cannot sit next to B') ko side mein cross mark karke likhein.", "formulas": ["Step 1: Sabse pehle fixed/definite clue ko grid mein place karein", "Step 2: Connected clues ko chain ki tarah jodein", "Step 3: Maximum 2 parallel cases banayein—invalid case apne aap eliminate ho jayega"], "examples": [{"q": "4 friends P, Q, R, S alag colors pasand karte hain: Red, Blue, Green, Yellow. P ko Red pasand hai; Q ko Blue/Green nahi pasand; R ko Green pasand hai. S ko kaunsa color pasand hai?", "steps": "Step 1: P=Red, R=Green.\nStep 2: Q cannot be Blue ⇒ Q=Yellow.\nStep 3: Remaining S = Blue."}, {"q": "Agar A > B, C < D, aur B > D hai, toh sabse chhota kaun hai?", "steps": "Step 1: Chain banayein: A > B > D > C.\nStep 2: Sabse chhota = C."}], "mcqs": [{"q": "5 boxes A, B, C, D, E ek ke upar ek rakhe hain. A, B ke turant upar hai; C sabse niche hai; D, E ke upar hai par B ke niche. Sabse upar kaunsa box hai?", "options": ["A", "B", "D", "E"], "ans": 0, "exp": "Order top-to-bottom: A, B, D, E, C ⇒ Top = A."}, {"q": "Agar P tall hai Q se, R short hai S se, aur Q tall hai S se, toh sabse tall kaun hai?", "options": ["P", "Q", "R", "S"], "ans": 0, "exp": "P > Q > S > R ⇒ Tallest = P."}, {"q": "3 subjects Math, Physics, Chem Mon, Tue, Wed ko hain. Math Wed ko nahi hai; Physics Tue ko hai; Chem Mon ko nahi hai. Math kis din hai?", "options": ["Monday", "Tuesday", "Wednesday", "Cannot say"], "ans": 0, "exp": "Tue=Physics. Chem ≠ Mon ⇒ Wed=Chem ⇒ Mon=Math."}]}, {"id": "lr-analogy", "section": "lr", "title": "Analogy Test", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Analogy mein do words ya numbers ke beech ka exact relationship pehchankar wahi logic third item par lagana hota hai (A : B :: C : ?).", "examFocus": "Word analogy mein relation ko ek sentence mein bana lein (e.g., 'Doctor works in Hospital'), aur number analogy mein squares, cubes, aur ×n±k check karein.", "formulas": ["Common Word Relations: Tool–Worker, Cause–Effect, Country–Capital, Study–Subject, Synonym/Antonym", "Number Analogy Priority: Prime → Square/Cube → Multiply/Divide → Addition/Digit sum"], "examples": [{"q": "Doctor : Hospital :: Teacher : ?", "steps": "Step 1: Relation = Professional : Workplace.\nStep 2: Teacher works in School."}, {"q": "5 : 26 :: 7 : ?", "steps": "Step 1: Pattern = n : n² + 1 (5² + 1 = 26).\nStep 2: 7² + 1 = 50."}], "mcqs": [{"q": "Thermometer : Temperature :: Barometer : ?", "options": ["Humidity", "Atmospheric Pressure", "Wind Speed", "Rainfall"], "ans": 1, "exp": "Barometer atmospheric pressure measure karta hai."}, {"q": "8 : 64 :: 11 : ?", "options": ["110", "121", "132", "144"], "ans": 1, "exp": "Relation is n : n² ⇒ 11² = 121."}, {"q": "Ornithology : Birds :: Entomology : ?", "options": ["Fishes", "Insects", "Reptiles", "Plants"], "ans": 1, "exp": "Entomology insects ki study hoti hai."}]}, {"id": "lr-linear-arrangements", "section": "lr", "title": "Linear Arrangements", "priority": "Very High", "expectedQs": "2 Qs", "definition": "Linear Arrangement mein log ek single row (North/South facing) ya do parallel rows mein baithe hote hain aur aapko unki exact positions nikalni hoti hain.", "examFocus": "North facing mein Left = aapka Left, Right = aapka Right. South facing mein bilkul ulta hota hai! 'Immediate left' aur 'Second to the left' ka farq dhyan se padhein.", "formulas": ["North Facing: Left ← [Person] → Right", "South Facing: Right ← [Person] → Left", "Extreme ends par baithe logon ke clues sabse pehle fix karein"], "examples": [{"q": "A, B, C, D, E North face karke ek row mein baithe hain. C beech mein hai. A aur B ends par hain. D, C ke immediate right par hai. E kahan baitha hai?", "steps": "Step 1: Positions: _ _ C D _.\nStep 2: Ends par A aur B ⇒ Position 2 par E (C ke immediate left)."}, {"q": "5 log row mein hain: P, Q ke left mein hai par R ke right mein. S, T ke left mein hai par Q ke right mein. Beech mein kaun hai?", "steps": "Step 1: R - P - Q - S - T.\nStep 2: Middle = Q."}], "mcqs": [{"q": "5 friends A, B, C, D, E North face karke baithe hain. B, D ke right mein hai; E, B ke right mein hai; A, C ke right mein aur D ke left mein hai. Extreme left par kaun hai?", "options": ["A", "C", "D", "E"], "ans": 1, "exp": "Order: C - A - D - B - E ⇒ Extreme left = C."}, {"q": "Upar wale arrangement (C-A-D-B-E) mein D ke second to the right kaun baitha hai?", "options": ["B", "E", "A", "C"], "ans": 1, "exp": "D ke 1st right = B, 2nd right = E."}, {"q": "Agar 6 log South face karke baithe hain aur X, Y ke immediate right mein hai, toh aapke paper view mein X, Y ke kis taraf hoga?", "options": ["Right side", "Left side", "Opposite", "Cannot say"], "ans": 1, "exp": "South facing mein person ka Right, reader ke Left side hota hai."}]}, {"id": "lr-blood-relations", "section": "lr", "title": "Blood Relationship Tests", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Family tree ya pointing-to-a-photo wale sawalon mein do logon ke beech ka exact rishta nikalna hota hai.", "examFocus": "Standard notation banayein: Male = `+`, Female = `−`, Siblings = `—`, Married couple = `=`, Generation gap = vertical line. Gender kabhi sirf naam se assume na karein!", "formulas": ["Father's/Mother's only son = Myself (if male) or Brother (if female)", "Pointing questions ko hamesha 'my' (speaker) se backward decode karein", "A + B means A is father of B ⇒ Coded blood relation mein right-to-left scan karein"], "examples": [{"q": "Ek photo ki taraf ishara karte hue Rahul ne kaha, 'Ye mere father ke iklaute bete ka beta hai.' Photo mein ladka Rahul ka kaun hai?", "steps": "Step 1: Rahul's father's only son = Rahul himself.\nStep 2: Rahul's son ⇒ Son."}, {"q": "A, B ka brother hai; C, A ki mother hai; D, C ka father hai. B ka D se kya rishta hai?", "steps": "Step 1: D is maternal grandfather of A and B.\nStep 2: B ka gender clear nahi hai ⇒ Grandson or Granddaughter."}], "mcqs": [{"q": "Pointing to a woman, Amit said, 'Her mother is the only daughter of my mother.' How is Amit related to the woman?", "options": ["Father", "Brother", "Maternal Uncle", "Grandfather"], "ans": 2, "exp": "Only daughter of Amit's mother = Amit's sister. So Amit is the woman's Maternal Uncle."}, {"q": "P is Q's sister. R is Q's mother. S is R's father. How is P related to S?", "options": ["Daughter", "Granddaughter", "Niece", "Sister"], "ans": 1, "exp": "S is R's father, and P is R's daughter ⇒ P is S's Granddaughter."}, {"q": "Agar A × B ka matlab A is wife of B, aur A + B ka matlab A is brother of B, toh P + Q × R mein P, R ka kaun hai?", "options": ["Brother", "Brother-in-law", "Father", "Son"], "ans": 1, "exp": "Q is wife of R, and P is brother of Q ⇒ P is R's Brother-in-law."}]}, {"id": "lr-direction-distance", "section": "lr", "title": "Direction and Distance Test", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Koi person North/South/East/West mein chalta hai aur Left/Right turn leta hai—aapko uski final direction ya shortest distance (Pythagoras) nikalni hoti hai.", "examFocus": "Right turn = 90° Clockwise; Left turn = 90° Anti-clockwise. Shadow questions mein Morning sun East mein (shadow West mein) aur Evening sun West mein (shadow East mein) hota hai.", "formulas": ["Right Turn = 90° Clockwise | Left Turn = 90° Anti-clockwise", "Shortest Distance = √((Net East−West)² + (Net North−South)²)", "Morning Shadow falls towards West | Evening Shadow falls towards East"], "examples": [{"q": "Ravi 6 km North gaya, phir Right turn lekar 8 km chala. Starting point se shortest distance kya hai?", "steps": "Step 1: North = 6, East = 8.\nStep 2: Distance = √(6² + 8²) = √100 = 10 km (North-East)."}, {"q": "Subah ke waqt Rohan ki shadow uske exact Right side pad rahi hai. Wo kis direction mein face kar raha hai?", "steps": "Step 1: Morning shadow = West.\nStep 2: West is on his Right ⇒ He is facing South."}], "mcqs": [{"q": "Neha 10m East chalti hai, phir Left mudkar 5m, phir Left mudkar 10m chalti hai. Ab wo starting point se kitni door hai?", "options": ["5m North", "5m South", "10m East", "15m North"], "ans": 0, "exp": "10m East aur 10m West cancel ho gaye ⇒ 5m North bacha."}, {"q": "Ek aadmi 3 km South aur phir 4 km West chalta hai. Starting point se shortest distance kya hai?", "options": ["7 km", "5 km", "6 km", "4.5 km"], "ans": 1, "exp": "√(3² + 4²) = 5 km."}, {"q": "Agar North-East ko East kaha jaye (45° clockwise shift), toh South ko kya kaha jayega?", "options": ["South-East", "South-West", "West", "North-West"], "ans": 1, "exp": "South se 45° clockwise = South-West."}]}, {"id": "lr-statements-arguments", "section": "lr", "title": "Statements and Arguments", "priority": "High", "expectedQs": "1 Q", "definition": "Ek controversial policy/action statement diya hota hai aur uske favor ('Yes') ya against ('No') do arguments diye hote hain. Aapko decide karna hota hai kaunsa argument 'Strong' hai aur kaunsa 'Weak'.", "examFocus": "Strong argument logical, practical, aur directly linked hota hai. Weak argument mein extreme words ('only', 'always'), blind imitation ('other countries do it'), ya emotional bias hota hai.", "formulas": ["Strong = Factually sound, practical, directly addresses core issue", "Weak = Superficial, ambiguous, extreme ('only way'), or copycat ('US does it')"], "examples": [{"q": "Statement: Kya colleges mein attendance compulsory honi chahiye? Arg I: Haan, isse discipline aur regular learning badhti hai. Arg II: Nahi, kisi aur desh mein aisa nahi hota.", "steps": "Step 1: Arg I logical aur direct hai (Strong).\nStep 2: Arg II blind imitation hai (Weak). ⇒ Only I is strong."}, {"q": "Statement: Kya plastic bags par complete ban lagna chahiye? Arg I: Haan, ye environment pollution ko kaafi kam karega. Arg II: Nahi, logo ko saman le jaane mein mushkil hogi.", "steps": "Step 1: Arg I strong environmental logic hai.\nStep 2: Arg II weak hai kyunki cloth/paper bags jaise practical alternatives hain."}], "mcqs": [{"q": "Statement: Should electric vehicles be subsidized in India? Arg I: Yes, it reduces urban air pollution and oil imports. Arg II: No, petrol cars look better.", "options": ["Only I is strong", "Only II is strong", "Both strong", "Neither strong"], "ans": 0, "exp": "Arg I economic & environmental logic deta hai; Arg II trivial opinion hai."}, {"q": "Kaunsa keyword aam taur par ek argument ko WEAK banata hai?", "options": ["Practical impact", "Only possible solution", "Cost-benefit logic", "Public safety"], "ans": 1, "exp": "'Only possible solution' extreme generalization hai, jo argument ko weak banata hai."}, {"q": "Statement: Should coding be taught in high schools? Arg I: Yes, it builds problem-solving skills for modern careers. Arg II: Yes, every student will become a billionaire.", "options": ["Only I is strong", "Only II is strong", "Both strong", "Neither strong"], "ans": 0, "exp": "Arg I realistic aur strong hai; Arg II exaggerated aur unrealistic hai."}]}, {"id": "lr-statements-assumptions", "section": "lr", "title": "Statements Assumptions", "priority": "High", "expectedQs": "1 Q", "definition": "Assumption wo hidden unstated baat hoti hai jo author ne statement bolte waqt pehle se sach maani hoti hai.", "examFocus": "Notice/Advertisement wale statements mein hamesha ye assumption implicit hota hai ki 'log notice padhenge aur respond karenge'. Extreme words ('all', 'only', 'never') wale assumptions galat hote hain.", "formulas": ["Assumption = Statement se PEHLE ka hidden belief (must be directly linked)", "Negation Test: Assumption ko ulta kar dein—agar statement toot jaye, toh assumption IMPLICIT hai!"], "examples": [{"q": "Statement: 'Please switch off your mobile phones inside the exam hall.' Assumption: Students bring mobile phones to the exam hall.", "steps": "Step 1: Agar koi phone laata hi nahi toh ye notice kyun lagate? ⇒ Assumption is Implicit."}, {"q": "Statement: 'Buy Brand X shoes for maximum comfort.' Assumption: People value comfort when buying shoes.", "steps": "Step 1: Brand comfort ko selling point bana raha hai, matlab log comfort pasand karte hain ⇒ Implicit."}], "mcqs": [{"q": "Statement: 'Use XYZ toothpaste for sparkling white teeth.' Assumption I: People want white teeth. Assumption II: No other toothpaste works.", "options": ["Only I is implicit", "Only II is implicit", "Both implicit", "Neither implicit"], "ans": 0, "exp": "Ad white teeth promise kar raha hai (I implicit), par II extreme claim hai (not implicit)."}, {"q": "Statement: 'Take a raincoat if you are going out today.' Assumption: It might rain today.", "options": ["Implicit", "Not implicit", "Contradicts statement", "Conclusion only"], "ans": 0, "exp": "Raincoat suggest karne ka hidden basis yahi hai ki baarish ho sakti hai."}, {"q": "Negation test ke mutabik ek assumption kab implicit hoti hai?", "options": ["Jab use negate karne par statement meaningless ho jaye", "Jab usme 'only' word ho", "Jab wo statement ka exact repeat ho", "Jab wo future prediction ho"], "ans": 0, "exp": "Agar assumption ko false maan ne se statement toot jaye, toh wo valid implicit assumption hai."}]}, {"id": "lr-coding-decoding", "section": "lr", "title": "Coding and Decoding", "priority": "High", "expectedQs": "2 Qs", "definition": "Letters ya words ko kisi hidden pattern (+n shift, reverse order, opposite letter pairs, ya number codes) mein encode kiya jata hai aur aapko naya word decode karna hota hai.", "examFocus": "A=1 se Z=26 tak position values aur `EJOTY` (5, 10, 15, 20, 25) + Opposite pairs (A-Z, B-Y, C-X, D-W... sum=27) tips par yaad rakhein!", "formulas": ["EJOTY Rule: E=5, J=10, O=15, T=20, Y=25", "Opposite Letter Pair: Position(L1) + Position(L2) = 27 (e.g., A=1, Z=26 ⇒ 27)", "Check order: +k shift → Alternating +k/−k → Reverse word → Opposite letters → Sum of positions"], "examples": [{"q": "Agar 'CAT' ko 'FDW' likha jaye, toh 'DOG' ko kya likhenge?", "steps": "Step 1: C(+3)=F, A(+3)=D, T(+3)=W.\nStep 2: D(+3)=G, O(+3)=R, G(+3)=J ⇒ GRJ."}, {"q": "Agar 'BAD' = 7 (2+1+4), toh 'CAB' kya hoga?", "steps": "Step 1: C=3, A=1, B=2.\nStep 2: 3 + 1 + 2 = 6."}], "mcqs": [{"q": "Agar 'APPLE' ko 'BQQMF' code kiya jaye, toh 'MANGO' ka code kya hoga?", "options": ["NBOHP", "NBOHO", "MBNHP", "OBOHP"], "ans": 0, "exp": "Har letter mein +1 shift hai: M→N, A→B, N→O, G→H, O→P ⇒ NBOHP."}, {"q": "Opposite letter rule (A=Z, B=Y) mein 'BOY' ka code kya hoga?", "options": ["YLB", "YOB", "ZLB", "YLA"], "ans": 0, "exp": "B(2)↔Y(25), O(15)↔L(12), Y(25)↔B(2) ⇒ YLB."}, {"q": "Agar 'PEN' = 35 (16+5+14), toh 'BOOK' kitna hoga?", "options": ["41", "43", "45", "47"], "ans": 1, "exp": "B(2) + O(15) + O(15) + K(11) = 43."}]}, {"id": "lr-inferences", "section": "lr", "title": "Inferences", "priority": "High", "expectedQs": "1 Q", "definition": "Inference wo logical deduction hai jo diye gaye paragraph ya facts ke basis par 100% definitely true nikalti hai—bina koi bahari knowledge add kiye.", "examFocus": "Inference aur Assumption mein confuse mat hon: Assumption statement ke pehle aati hai; Inference statement ke BAAD uske facts se logically derive hoti hai.", "formulas": ["Stick strictly to the passage—bahar ka GK ya personal opinion mat lagayein", "Eliminate options with extreme scope ('all', 'never', 'guaranteed') unless stated"], "examples": [{"q": "Fact: Gujarat ke sabhi government MCA colleges ACPC merit list ke zariye CMAT score par admission dete hain. Jatin ko LDCE mein admission mila. Kya infer hota hai?", "steps": "Step 1: Jatin ne CMAT diya aur ACPC merit list ke through qualify kiya."}, {"q": "Fact: Is saal barish normal se 30% kam hui, jisse dam water levels gir gaye. Valid inference kya hai?", "steps": "Step 1: Dam water levels kam hone ka ek direct factor kam barish hai."}], "mcqs": [{"q": "Passage: 'Only students scoring above 75% in the mock test received scholarships.' Rahul received a scholarship. What MUST be true?", "options": ["Rahul topped the test", "Rahul scored above 75%", "Rahul is from Gujarat", "All students got scholarships"], "ans": 1, "exp": "Kyunki sirf 75% se upar walon ko scholarship mili, Rahul ka score >75% definitely true hai."}, {"q": "Passage: 'Remote work reduced daily commuting time by 40% for IT employees.' Valid inference?", "options": ["All companies will close offices", "IT employees saved significant commute time via remote work", "Traffic dropped to zero", "Salaries increased"], "ans": 1, "exp": "Sirf option B directly passage se supported hai; baaki sab over-extrapolations hain."}, {"q": "Inference questions solve karte waqt kaunsa option turant eliminate karna chahiye?", "options": ["Direct paraphrase of fact", "Logical deduction", "Unsupported outside information", "Moderate statement"], "ans": 2, "exp": "Jo info passage mein hai hi nahi, wo valid inference nahi ho sakti."}]}, {"id": "lr-statements-conclusion", "section": "lr", "title": "Statements and Conclusion", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Isme Syllogisms (All/Some/No statements) aur Verbal Conclusions dono aate hain. Aapko check karna hota hai ki diye gaye conclusions 100% logically follow karte hain ya nahi.", "examFocus": "Syllogisms ke liye hamesha Venn Diagrams draw karein. 'Some A are B' se kabhi 'Some A are not B' follow NAHI karta! Either-Or rule (Some + No / Some + Some not) zaroor yaad rakhein.", "formulas": ["All A are B ⇒ Some B are A (Always True), par All B are A (Not definite)", "No A is B ⇒ No B is A (Always True)", "Complementary Pair (Either-Or): Both individual conclusions false + Same subject/predicate + (Some & No) or (Some & Some Not)"], "examples": [{"q": "Statements: All pens are books. All books are tables. Conclusion: All pens are tables.", "steps": "Step 1: Inner circle = Pens, Middle = Books, Outer = Tables.\nStep 2: Pens completely Tables ke andar hain ⇒ Conclusion follows."}, {"q": "Statements: Some cats are dogs. No dog is a lion. Conclusion: Some cats are not lions.", "steps": "Step 1: Jo cats dogs hain, wo kabhi lions nahi ho sakti.\nStep 2: Conclusion definitely follows."}], "mcqs": [{"q": "Statements: All apples are fruits. Some fruits are red. Conclusion I: Some apples are red. Conclusion II: Some fruits are apples.", "options": ["Only I follows", "Only II follows", "Both follow", "Neither follows"], "ans": 1, "exp": "All apples are fruits ⇒ Some fruits are apples (II definite). Red ka overlap apples se definite nahi (I false)."}, {"q": "Statements: No car is a bus. All buses are trucks. Conclusion: No car is a truck.", "options": ["Follows", "Does not follow", "Either-or", "Definitely true"], "ans": 1, "exp": "Car bus nahi hai, par car ka kuch hissa truck (outside bus) ho sakta hai ⇒ Does not follow."}, {"q": "Statements: Some A are B. Some B are C. Conclusion I: Some A are C. Conclusion II: No A is C.", "options": ["Only I follows", "Only II follows", "Either I or II follows", "Both follow"], "ans": 2, "exp": "Dono individually uncertain hain aur 'Some + No' complementary pair banate hain ⇒ Either I or II."}]}, {"id": "lr-ranking", "section": "lr", "title": "Ranking Tests", "priority": "Medium", "expectedQs": "1 Q", "definition": "Ek line ya class merit list mein kisi person ki left/top aur right/bottom se position di hoti hai aur total students ya beech ke logon ki count nikalni hoti hai.", "examFocus": "Total = Left + Right − 1 (kyunki same person 2 baar count ho jata hai!). Minimum total wale overlap cases bhi dhyan rakhein.", "formulas": ["Total Persons = Rank from Top + Rank from Bottom − 1", "Rank from Right = Total − Rank from Left + 1", "Position Interchange: Total = New position of A + Old position of B − 1"], "examples": [{"q": "Ek class mein Jatin top se 12th aur bottom se 25th rank par hai. Total students kitne hain?", "steps": "Step 1: Total = 12 + 25 − 1 = 36 students."}, {"q": "50 students ki row mein Priya left se 18th hai. Right se uski position kya hogi?", "steps": "Step 1: Right = 50 − 18 + 1 = 33rd."}], "mcqs": [{"q": "Ek row mein Aman left se 15th aur right se 20th hai. Row mein total kitne log hain?", "options": ["35", "34", "36", "33"], "ans": 1, "exp": "15 + 20 − 1 = 34."}, {"q": "40 students ki class mein Riya top se 9th hai. Bottom se uska rank kya hoga?", "options": ["31st", "32nd", "30th", "33rd"], "ans": 1, "exp": "40 − 9 + 1 = 32nd."}, {"q": "Row mein A left se 10th aur B right se 15th hai. Position swap karne par A left se 18th ho jata hai. Total log kitne hain?", "options": ["31", "32", "33", "34"], "ans": 1, "exp": "Total = A's new (18) + B's old (15) − 1 = 32."}]}, {"id": "lr-non-verbal", "section": "lr", "title": "Non-Verbal Reasoning", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Isme Mirror Images, Water Images, Paper Folding/Cutting, Dice (opposite faces), aur Figure Series ke visual questions aate hain.", "examFocus": "Standard Dice mein opposite faces ka sum 7 hota hai. Mirror image mein Left↔Right flip hota hai (Top/Bottom same); Water image mein Top↔Bottom flip hota hai.", "formulas": ["Mirror Image: Left ↔ Right flips | Top & Bottom unchanged", "Water Image: Top ↔ Bottom flips | Left & Right unchanged", "Dice One-Common-Face Rule: Common face se clockwise likhein — matching positions opposite hoti hain"], "examples": [{"q": "Clock mein 3:00 baj rahe hain. Mirror image mein kya time dikhega?", "steps": "Step 1: Mirror time = 12:00 − 3:00 = 9:00."}, {"q": "Standard dice mein 2 ke opposite kaunsa number hota hai?", "steps": "Step 1: Standard dice opposite sum = 7 ⇒ 7 − 2 = 5."}], "mcqs": [{"q": "Agar clock mein 4:20 baj rahe hain, toh mirror image mein kya time dikhega?", "options": ["7:40", "8:40", "7:20", "8:20"], "ans": 0, "exp": "11:60 − 4:20 = 7:40."}, {"q": "Ek dice ke do views mein (1, 2, 3) aur (1, 5, 6) dikhte hain. 1 ke opposite kaunsa number hai?", "options": ["2", "3", "4", "6"], "ans": 2, "exp": "1 ke adjacent 2, 3, 5, 6 hain ⇒ remaining 4 opposite hoga."}, {"q": "Mirror image mein kaunsa capital letter bilkul same dikhta hai?", "options": ["F", "L", "M", "R"], "ans": 2, "exp": "M vertically symmetrical hai, isliye mirror mein same dikhta hai."}]}, {"id": "lr-sequencing", "section": "lr", "title": "Sequencing", "priority": "High", "expectedQs": "1 Q", "definition": "Sequencing mein events, floors, days of the week, ya logical dictionary/process order ko sahi sequence mein arrange karna hota hai.", "examFocus": "Floor puzzles mein sabse niche Floor 1 aur sabse upar Floor N maan kar vertical table banayein.", "formulas": ["Meaningful Order: Smallest → Largest (or Cause → Process → Result)", "Floor Puzzles: Fixed floor number pehle bharein, phir gap clues ('2 floors between A and B')"], "examples": [{"q": "Logical order mein lagayein: 1. College 2. Job 3. School 4. Salary 5. Interview.", "steps": "Step 1: School (3) → College (1) → Interview (5) → Job (2) → Salary (4)."}, {"q": "4 floors (1 to 4): A 3rd floor par hai; B, A ke upar hai; C sabse niche nahi hai. D kis floor par hai?", "steps": "Step 1: 4=B, 3=A, 2=C, 1=D ⇒ Floor 1."}], "mcqs": [{"q": "Logical sequence chunein: 1. Seed 2. Fruit 3. Plant 4. Tree 5. Flower.", "options": ["1, 3, 4, 5, 2", "1, 4, 3, 2, 5", "3, 1, 4, 5, 2", "1, 3, 5, 4, 2"], "ans": 0, "exp": "Seed → Plant → Tree → Flower → Fruit."}, {"q": "Dictionary order mein pehla word kaunsa aayega: Train, Track, Trade, Trap?", "options": ["Train", "Track", "Trade", "Trap"], "ans": 1, "exp": "T-R-A common hai; 4th letter 'c' (Track) sabse pehle aata hai."}, {"q": "5 floors (1–5) par P 2nd par hai, Q top par hai, R aur S ke beech 1 floor hai aur R > P. Floor 1 par kaun ho sakta hai?", "options": ["Q", "P", "S or T", "R"], "ans": 2, "exp": "Q=5, P=2, R>P so R=3 or 4 ⇒ Floor 1 par S ya T hi ho sakta hai."}]}, {"id": "lr-matrix-arrangements", "section": "lr", "title": "Matrix Arrangements", "priority": "Very High", "expectedQs": "1-2 Qs", "definition": "Matrix Arrangements mein multiple variables (e.g., Person + City + Profession) ko ek 2D table (rows & columns) mein match karna hota hai.", "examFocus": "Fixed column (jaise Persons A, B, C, D) ko left mein likhein aur baaki attributes ko columns mein. Positive info direct fill karein aur negative info side mein bracket mein likhein.", "formulas": ["Rows = Primary Entities (Persons/Days) | Columns = Attributes (City, Job, Hobby)", "Har negative clue eliminate karta hai — elimination se hi aakhri cells bhar jaate hain"], "examples": [{"q": "3 friends A, B, C — Cities: Surat, Rajkot, Vadodara; Jobs: Dev, CA, Doctor. A Surat se hai aur CA nahi hai; Doctor Vadodara se hai; B CA hai. A ka job kya hai?", "steps": "Step 1: B=CA. A Surat se hai ⇒ A Doctor nahi ho sakta (Doctor Vadodara se hai) ⇒ A = Dev."}, {"q": "Upar wale example mein C kis city se hai?", "steps": "Step 1: A=Dev (Surat), B=CA (Rajkot), C=Doctor (Vadodara) ⇒ Vadodara."}], "mcqs": [{"q": "3 cars Red, Blue, White — Brands: Tata, Maruti, Hyundai. Red Tata nahi hai; Hyundai White hai; Blue Maruti nahi hai. Red car kis brand ki hai?", "options": ["Tata", "Maruti", "Hyundai", "Cannot say"], "ans": 1, "exp": "White=Hyundai. Blue ≠ Maruti ⇒ Blue=Tata ⇒ Red=Maruti."}, {"q": "Matrix puzzle mein sabse efficient pehla step kya hota hai?", "options": ["Guessing from options", "Drawing a fixed-row attribute table", "Skipping negative clues", "Solving mentally"], "ans": 1, "exp": "Structured table banane se multiple attributes bina confusion track ho jaate hain."}, {"q": "4 students P, Q, R, S study 4 languages C, Java, Python, Go. P learns Python; Q doesn't learn C or Go; R learns Go. S kya seekhta hai?", "options": ["C", "Java", "Python", "Go"], "ans": 0, "exp": "P=Python, R=Go, Q=Java ⇒ S=C."}]}, {"id": "lr-symbol-based", "section": "lr", "title": "Symbol Based Problems", "priority": "Medium", "expectedQs": "1 Q", "definition": "Isme mathematical operators (`+, −, ×, ÷`) ke meanings badal diye jaate hain (e.g., `+` means `×`) aur naye expression ko BODMAS rule se evaluate karna hota hai.", "examFocus": "Operators replace karne ke baad BODMAS (Bracket, Of, Division, Multiplication, Addition, Subtraction) strictly follow karein!", "formulas": ["BODMAS Order: Brackets → Orders/Of → Division → Multiplication → Addition → Subtraction", "Option-checking questions mein pehle Division (÷) check karein — exact divisible option jaldi milta hai"], "examples": [{"q": "Agar '+' means '×', '−' means '+', aur '×' means '÷', toh 12 × 3 + 4 − 2 = ?", "steps": "Step 1: Replace symbols: 12 ÷ 3 × 4 + 2.\nStep 2: BODMAS: 4 × 4 + 2 = 16 + 2 = 18."}, {"q": "Agar A = +, B = −, C = ×, toh 10 C 2 A 5 B 3 = ?", "steps": "Step 1: 10 × 2 + 5 − 3 = 20 + 5 − 3 = 22."}], "mcqs": [{"q": "Agar '+' means '÷', '×' means '+', aur '−' means '×', toh 24 + 6 − 2 × 5 = ?", "options": ["13", "15", "18", "12"], "ans": 0, "exp": "24 ÷ 6 × 2 + 5 = 4 × 2 + 5 = 13."}, {"q": "Agar P = ×, Q = ÷, R = +, S = −, toh 18 Q 3 P 2 R 4 S 1 = ?", "options": ["14", "15", "16", "17"], "ans": 1, "exp": "18 ÷ 3 × 2 + 4 − 1 = 6 × 2 + 4 − 1 = 15."}, {"q": "Symbol replacement ke baad kaunsa operation pehle hota hai?", "options": ["Addition", "Subtraction", "Division", "Left to Right blindly"], "ans": 2, "exp": "BODMAS ke anusar Division/Multiplication, Addition/Subtraction se pehle hota hai."}]}, {"id": "lr-venn-diagram", "section": "lr", "title": "Venn Diagram", "priority": "High", "expectedQs": "1 Q", "definition": "Venn Diagrams 2 ya 3 overlapping sets (e.g., Tea, Coffee, Both) ke beech ka relation aur count nikalne ke liye use hote hain.", "examFocus": "3-circle Venn diagrams mein hamesha sabse andar wale common region (`A ∩ B ∩ C`) se bahar ki taraf fill karna shuru karein!", "formulas": ["2 Sets: n(A ∪ B) = n(A) + n(B) − n(A ∩ B)", "Total = n(A ∪ B) + Neither", "Only A = n(A) − n(A ∩ B)"], "examples": [{"q": "60 students mein 35 Cricket aur 30 Football khelte hain, aur 10 dono khelte hain. Kitne students koi bhi game nahi khelte?", "steps": "Step 1: At least one = 35 + 30 − 10 = 55.\nStep 2: Neither = 60 − 55 = 5."}, {"q": "Apple, Fruit, Vegetable ka sahi Venn Diagram kya hoga?", "steps": "Step 1: Apple circle poora Fruit ke andar hoga; Vegetable alag circle hoga."}], "mcqs": [{"q": "100 logon mein 60 Tea peete hain, 50 Coffee, aur 20 dono. Sirf Tea peene wale kitne hain?", "options": ["40", "30", "50", "20"], "ans": 0, "exp": "Only Tea = 60 − 20 = 40."}, {"q": "Upar wale example mein kitne log na Tea peete hain na Coffee?", "options": ["0", "10", "20", "15"], "ans": 1, "exp": "At least one = 60 + 50 − 20 = 90 ⇒ Neither = 100 − 90 = 10."}, {"q": "Doctors, Men, Human Beings ke liye best Venn Diagram relation kya hai?", "options": ["3 disjoint circles", "3 concentric circles", "Doctors & Men overlap inside Human Beings", "Doctors inside Men"], "ans": 2, "exp": "Sabhi Doctors aur Men Human Beings hain, aur kuch Doctors Men hote hain."}]}, {"id": "lr-cause-effects", "section": "lr", "title": "Cause and Effects", "priority": "Medium", "expectedQs": "1 Q", "definition": "Do statements (I aur II) diye jaate hain aur aapko pehchanna hota hai ki kaunsa Cause (wajah) hai aur kaunsa Effect (natija), ya dono kisi common cause ke effects hain.", "examFocus": "Time sequence check karein: Cause hamesha Effect se PEHLE hota hai! Agar dono parallel events hon (jaise 'Petrol prices rose' aur 'Vegetable prices rose'), toh check karein kya ek dusre ki wajah hai ya dono common cause ke effect hain.", "formulas": ["Cause happens FIRST → Effect happens AFTER", "Check 5 standard options: I→II, II→I, Both independent causes, Both effects of independent causes, Both effects of a common cause"], "examples": [{"q": "I: Shehar mein 3 din lagataar bhari baarish hui. II: Kai low-lying areas mein waterlogging aur traffic jam ho gaya.", "steps": "Step 1: Bhari baarish ki wajah se waterlogging hui ⇒ Statement I is Cause, II is Effect."}, {"q": "I: Schools ne summer holidays 1 week badha di. II: Hospitals mein heatstroke ke patients badh gaye.", "steps": "Step 1: Dono ek common cause (severe heatwave) ke effects hain."}], "mcqs": [{"q": "I: University postponed semester exams by a week. II: Heavy cyclone warning was issued across coastal Gujarat.", "options": ["I is cause, II is effect", "II is cause, I is effect", "Both independent causes", "Both effects of common cause"], "ans": 1, "exp": "Cyclone warning (II) ki wajah se exams postpone (I) hue."}, {"q": "I: Prices of tomatoes doubled this week. II: Unseasonal rains destroyed tomato crops in major states.", "options": ["I is cause, II is effect", "II is cause, I is effect", "Both independent", "Common cause"], "ans": 1, "exp": "Fasal kharab hone (II) se prices double (I) hue."}, {"q": "I: City Metro recorded record ridership this month. II: Petrol prices remained at an all-time high.", "options": ["I is cause, II is effect", "II is cause, I is effect", "Both independent causes", "No relation"], "ans": 1, "exp": "High petrol prices (II) ke karan zyada logon ne Metro (I) use ki."}]}, {"id": "lr-number-series", "section": "lr", "title": "Number Series", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Numbers ki ek sequence di hoti hai jisme missing term ya wrong term find karna hota hai.", "examFocus": "Agar numbers dhire badh rahe hain toh Difference (ya Double Difference) check karein; agar tezi se badh rahe hain toh Multiplication (`×n ± k`) ya Squares/Cubes check karein!", "formulas": ["Slow growth → First difference / Second difference", "Fast growth → ×2, ×3, n², n³, n²±n", "Up-Down series → Alternate series (odd positions alag, even positions alag)"], "examples": [{"q": "Find next: 3, 7, 15, 31, 63, ?", "steps": "Step 1: Pattern = ×2 + 1 (3×2+1=7, 7×2+1=15...).\nStep 2: 63 × 2 + 1 = 127."}, {"q": "Find next: 2, 6, 12, 20, 30, ?", "steps": "Step 1: Differences = +4, +6, +8, +10 ⇒ Next = +12.\nStep 2: 30 + 12 = 42 (or n² + n)."}], "mcqs": [{"q": "Find missing term: 4, 9, 19, 39, 79, ?", "options": ["149", "159", "169", "139"], "ans": 1, "exp": "Pattern: ×2 + 1 ⇒ 79 × 2 + 1 = 159."}, {"q": "Find next: 1, 8, 27, 64, 125, ?", "options": ["196", "216", "225", "256"], "ans": 1, "exp": "Cubes of natural numbers: 6³ = 216."}, {"q": "Find odd/wrong term: 5, 10, 17, 26, 37, 51", "options": ["17", "26", "37", "51"], "ans": 3, "exp": "Pattern is n² + 1 (2²+1=5, ..., 7²+1=50). So 51 is wrong (should be 50)."}]}, {"id": "lc-rc", "section": "lc", "title": "Reading Comprehension", "priority": "Very High", "expectedQs": "8-10 Qs", "definition": "Language Comprehension ka sabse bada hissa (lagbhag 50–60% weightage). CMAT mein 3 se 4 short-to-medium passages (300–500 words) aate hain jin par Main Idea, Tone, Fact-based, aur Vocab-in-context questions puche jaate hain.", "examFocus": "Pehle questions par 15 second nazar daalein, phir passage ko active mode mein padhein (har paragraph ka 1-line summary mind mein banate hue). Extreme options ('always', 'never') aam taur par galat hote hain.", "formulas": ["Main Idea = Scope poora passage cover kare (na too narrow, na too broad)", "Author's Tone: Critical, Analytical, Laudatory, Sarcastic, Objective (adjectives par dhyan dein)", "Elimination Rule: Out-of-scope aur Contradictory options turant hata dein"], "examples": [{"q": "Passage snippet: 'While AI automates routine coding, human engineers remain vital for architecture and ethics.' Author ka main point kya hai?", "steps": "Step 1: 'While' contrast dikhata hai — AI routine work karta hai, par humans architecture/ethics ke liye zaroori hain.\nStep 2: Main idea = AI complements rather than completely replaces engineers."}, {"q": "Agar author likhe 'This short-sighted policy ignores rural realities', toh tone kaisi hai?", "steps": "Step 1: Words 'short-sighted' aur 'ignores' disapproval dikhate hain ⇒ Critical tone."}], "mcqs": [{"q": "Snippet: 'Solar costs fell 80% in a decade, making clean energy economically viable even without subsidies.' What can be inferred?", "options": ["Fossil fuels are banned", "Solar power is now cost-competitive on its own", "Subsidies caused solar prices to rise", "Wind energy is cheaper than solar"], "ans": 1, "exp": "'Economically viable even without subsidies' means it is cost-competitive independently."}, {"q": "Author's tone jab wo sirf data aur statistics bina personal opinion ke present kare:", "options": ["Sarcastic", "Objective / Neutral", "Dogmatic", "Elegiac"], "ans": 1, "exp": "Fact-only, bias-free presentation ko Objective/Neutral tone kehte hain."}, {"q": "RC mein 'Main Idea' question ke liye best strategy kya hai?", "options": ["Sirf pehli line padhna", "Har paragraph ka central theme combine karna", "Sabse lamba option choose karna", "Specific example wale option ko tick karna"], "ans": 1, "exp": "Main idea pure passage ke central theme ko summarize karta hai, kisi single detail ko nahi."}]}, {"id": "lc-usage-errors", "section": "lc", "title": "English Usage Errors", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Isme confused words (affect/effect, fewer/less, lay/lie), wrong prepositions, aur redundancy (e.g., 'return back', 'revert back') ko spot karna hota hai.", "examFocus": "CMAT mein 'redundancy' aur 'commonly confused pairs' par kaafi direct questions aate hain.", "formulas": ["Fewer = Countable nouns (fewer books) | Less = Uncountable (less water)", "Affect = Verb (influence) | Effect = Noun (result)", "Avoid Redundancy: 'return back' → 'return'; 'repeat again' → 'repeat'; 'cousin brother' → 'cousin'"], "examples": [{"q": "Spot the error: 'He returned back from Ahmedabad yesterday.'", "steps": "Step 1: 'Returned' mein 'back' ka meaning pehle se hota hai.\nStep 2: Correct: 'He returned from Ahmedabad yesterday.'"}, {"q": "Choose correct: 'There are (less / fewer) students in class today.'", "steps": "Step 1: Students countable hain ⇒ 'fewer' use hoga."}], "mcqs": [{"q": "Which sentence is free of usage error?", "options": ["The new rule had a positive affect.", "The new rule had a positive effect.", "Please revert back soon.", "She is my cousin sister."], "ans": 1, "exp": "'Effect' noun hai ('a positive effect'); baaki teeno mein usage/redundancy errors hain."}, {"q": "Fill in the blank: 'The team comprises ____ five developers.'", "options": ["of", "with", "no preposition needed", "by"], "ans": 2, "exp": "Active voice mein 'comprises' ke saath 'of' nahi lagta ('consists of' ya sirf 'comprises')."}, {"q": "Choose the correct usage: 'Between you and ____, this exam is manageable.'", "options": ["I", "me", "myself", "mine"], "ans": 1, "exp": "Preposition ('between') ke baad objective pronoun ('me') aata hai."}]}, {"id": "lc-grammar", "section": "lc", "title": "English Grammar", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Core grammar rules: Subject-Verb Agreement, Tenses, Conditionals, Active/Passive Voice, Modifiers, aur Parallelism.", "examFocus": "Subject-Verb Agreement (`Either...or`, `Neither...nor`, `Each of the...`, `One of the...`) aur Conditional sentences (If I were...) CMAT ke favorite grammar rules hain.", "formulas": ["'Each / Everyone / One of the + Plural Noun' takes SINGULAR verb", "'Neither A nor B' / 'Either A or B': Verb agrees with the NEAREST subject (B)", "'As well as / Along with / Together with': Verb agrees with the FIRST subject", "Parallelism: 'likes reading, coding, and traveling' (same verb form)"], "examples": [{"q": "Correct: 'One of my friends live in Vadodara.'", "steps": "Step 1: Subject is 'One' (singular), not 'friends'.\nStep 2: Correct = 'One of my friends lives in Vadodara.'"}, {"q": "Correct: 'Neither the manager nor the employees was present.'", "steps": "Step 1: Nearest subject 'employees' plural hai.\nStep 2: Correct = '...employees were present.'"}], "mcqs": [{"q": "The captain, along with his players, ____ arrived at the stadium.", "options": ["have", "has", "are", "were"], "ans": 1, "exp": "'Along with' hone par verb first subject ('The captain' = singular) ke hisaab se 'has' lagega."}, {"q": "If I ____ you, I would start taking CMAT mocks right now.", "options": ["was", "am", "were", "will be"], "ans": 2, "exp": "Imaginary/subjunctive conditional mein hamesha 'If I were' use hota hai."}, {"q": "Each of the five sections ____ 20 questions.", "options": ["contain", "contains", "are containing", "have"], "ans": 1, "exp": "'Each of...' hamesha singular verb ('contains') leta hai."}]}, {"id": "lc-para-completion", "section": "lc", "title": "Paragraph Completion", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Ek short paragraph diya hota hai jiski last line (ya middle line) missing hoti hai. Aapko logical flow, tone, aur context ke hisaab se best closing sentence choose karna hota hai.", "examFocus": "Correct option hamesha pichli line ke thought ko smoothly complete karta hai—koi bilkul naya topic start nahi karta aur author ki tone nahi badalta.", "formulas": ["Check Continuity: Penultimate sentence ka subject aur tone match karein", "Avoid New Ideas: Concluding line naya unrelated concept introduce nahi karti", "Watch Transitions: 'However', 'Therefore', 'Consequently' direction batate hain"], "examples": [{"q": "Paragraph: 'Electric scooters cut fuel costs drastically. However, lack of charging stations in small towns slows adoption. Therefore, ____'", "steps": "Step 1: 'Therefore' solution/result mangta hai.\nStep 2: Best completion = 'expanding charging infrastructure is essential for wider EV growth.'"}, {"q": "Avoid Trap: Agar paragraph EV charging par hai aur ek option aviation fuel ki baat kare, toh wo out-of-scope hai."}], "mcqs": [{"q": "'Consistent daily study beats last-minute cramming. Students who revise weekly retain twice as much. Clearly, ____'", "options": ["cramming is the best method.", "steady habits lead to stronger exam performance.", "exams should be abolished.", "sleep is unnecessary."], "ans": 1, "exp": "Option B directly paragraph ke core argument ko logically conclude karta hai."}, {"q": "Paragraph completion mein kaunsa option sabse pehle reject karna chahiye?", "options": ["One that summarizes the last idea", "One that introduces an unrelated new topic", "One matching author's tone", "One using a logical connector"], "ans": 1, "exp": "Closing sentence kabhi naya unrelated topic start nahi karta."}, {"q": "'The startup had a brilliant product, yet it ignored customer feedback for two years. As a result, ____'", "options": ["its loyal users gradually switched to competitors.", "it won a design award.", "the founders bought a new office.", "coding became easier."], "ans": 0, "exp": "'As a result' negative consequence (ignoring feedback → losing users) ko logically complete karta hai."}]}, {"id": "lc-synonyms", "section": "lc", "title": "Synonyms", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Diye gaye word ka sabse close similar meaning wala word choose karna hota hai.", "examFocus": "Root words (e.g., bene=good, mal=bad, chron=time, loq=speak) aur Positive/Negative tone polarity check karne se unknown words mein bhi 2–3 options eliminate ho jaate hain!", "formulas": ["Root Words: Bene (good), Mal (bad), Omni (all), Pan (all), Chron (time), Cred (believe)", "Polarity Check: Positive word ka synonym positive hi hoga; negative ka negative"], "examples": [{"q": "Synonym of 'BENEVOLENT':", "steps": "Step 1: Root 'bene' = good/kind.\nStep 2: Synonym = Kind / Generous / Charitable."}, {"q": "Synonym of 'EPHEMERAL':", "steps": "Step 1: Ephemeral = short-lived.\nStep 2: Synonym = Transient / Fleeting."}], "mcqs": [{"q": "Choose the closest synonym of 'PRAGMATIC':", "options": ["Idealistic", "Practical", "Lazy", "Aggressive"], "ans": 1, "exp": "Pragmatic ka matlab realistic aur practical hota hai."}, {"q": "Choose the closest synonym of 'MITIGATE':", "options": ["Worsen", "Lessen / Alleviate", "Ignore", "Create"], "ans": 1, "exp": "Mitigate ka matlab kisi nuksaan ya dard ko kam karna (alleviate)."}, {"q": "Choose the closest synonym of 'UBIQUITOUS':", "options": ["Rare", "Omnipresent", "Hidden", "Ancient"], "ans": 1, "exp": "Ubiquitous = har jagah maujood (omnipresent)."}]}, {"id": "lc-antonyms", "section": "lc", "title": "Antonyms", "priority": "High", "expectedQs": "1 Q", "definition": "Diye gaye word ka exact opposite meaning (vilom shabd) find karna hota hai.", "examFocus": "Exam mein jaldbaazi mein Antonym question mein Synonym tick mat kar dena! Question instruction ('OPPOSITE in meaning') hamesha do baar padhein.", "formulas": ["Prefix clues: un-, in-, im-, dis-, anti-, contra- aam taur par opposite banate hain", "Agar 3 options ek hi positive/negative tone ke hon, toh 4th opposite tone wala answer hota hai"], "examples": [{"q": "Antonym of 'FRUGAL' (kifayati):", "steps": "Step 1: Frugal = economical/thrifty.\nStep 2: Opposite = Extravaga
