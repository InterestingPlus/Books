// DELEGATED EVENTS
document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    state.activeTab = navBtn.dataset.nav;
    document.getElementById('mobileNav').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderAll();
    return;
  }

  if (e.target.closest('#brandHomeBtn')) {
    state.activeTab = 'dashboard';
    renderAll();
    return;
  }

  if (e.target.closest('#mobileMenuBtn')) {
    document.getElementById('mobileNav').classList.toggle('hidden');
    return;
  }

  const gotoBtn = e.target.closest('[data-goto]');
  if (gotoBtn) {
    state.activeTab = gotoBtn.dataset.goto;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderAll();
    return;
  }

  const jumpSec = e.target.closest('[data-jump-sec]');
  if (jumpSec) {
    state.secFilter = jumpSec.dataset.jumpSec;
    state.activeTab = 'syllabus';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderAll();
    return;
  }

  const secF = e.target.closest('[data-sec-filter]');
  if (secF) {
    state.secFilter = secF.dataset.secFilter;
    renderAll();
    return;
  }

  const openT = e.target.closest('[data-open-topic]');
  if (openT) {
    state.openTopicId = openT.dataset.openTopic;
    state.topicSubTab = 'concept';
    renderTopicModal();
    document.getElementById('topicModal').scrollTop = 0;
    return;
  }

  if (e.target.closest('#closeTopicModalBtn') || e.target.id === 'topicModal') {
    state.openTopicId = null;
    renderAll();
    return;
  }

  const tTab = e.target.closest('[data-topic-tab]');
  if (tTab) {
    state.topicSubTab = tTab.dataset.topicTab;
    renderTopicModal();
    return;
  }

  if (e.target.closest('#toggleMasterBtn')) {
    const id = state.openTopicId;
    if (state.completedTopics.includes(id)) {
      state.completedTopics = state.completedTopics.filter(x => x !== id);
      showToast('Removed from Mastered');
    } else {
      state.completedTopics.push(id);
      showToast('Topic Marked as Mastered!');
    }
    saveState();
    renderAll();
    return;
  }

  const mcqBtn = e.target.closest('[data-mcq-topic]');
  if (mcqBtn) {
    const key = `${mcqBtn.dataset.mcqTopic}_${mcqBtn.dataset.mcqQi}`;
    state.topicPracticeAnswers[key] = parseInt(mcqBtn.dataset.mcqOi, 10);
    renderTopicModal();
    return;
  }

  if (e.target.closest('#resetTopicPracticeBtn')) {
    const prefix = `${state.openTopicId}_`;
    Object.keys(state.topicPracticeAnswers).forEach(k => {
      if (k.startsWith(prefix)) delete state.topicPracticeAnswers[k];
    });
    renderTopicModal();
    return;
  }

  if (e.target.closest('#startTopicTestBtn')) {
    startMockSession('all', 3, state.openTopicId);
    return;
  }

  const startMock = e.target.closest('[data-start-mock]');
  if (startMock) {
    startMockSession(startMock.dataset.startMock, parseInt(startMock.dataset.mockCnt, 10));
    return;
  }

  const mockOpt = e.target.closest('[data-mock-opt]');
  if (mockOpt && state.mockSession && !state.mockSession.submitted) {
    state.mockSession.answers[state.mockSession.curr] = parseInt(mockOpt.dataset.mockOpt, 10);
    renderAll();
    return;
  }

  if (e.target.closest('#mockClearBtn') && state.mockSession) {
    delete state.mockSession.answers[state.mockSession.curr];
    renderAll();
    return;
  }

  if (e.target.closest('#mockMarkBtn') && state.mockSession) {
    const c = state.mockSession.curr;
    state.mockSession.marked[c] = !state.mockSession.marked[c];
    renderAll();
    return;
  }

  if (e.target.closest('#mockPrevBtn') && state.mockSession && state.mockSession.curr > 0) {
    state.mockSession.curr--;
    renderAll();
    return;
  }

  if (e.target.closest('#mockNextBtn') && state.mockSession && state.mockSession.curr < state.mockSession.qs.length - 1) {
    state.mockSession.curr++;
    renderAll();
    return;
  }

  const jumpQ = e.target.closest('[data-mock-jump]');
  if (jumpQ && state.mockSession) {
    state.mockSession.curr = parseInt(jumpQ.dataset.mockJump, 10);
    renderAll();
    return;
  }

  if (e.target.closest('#submitMockBtn')) {
    submitMockSession();
    return;
  }

  if (e.target.closest('#exitMockBtn')) {
    state.mockSession = null;
    renderAll();
    return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'topicSearchInput') {
    state.search = e.target.value;
    renderAll();
    const inp = document.getElementById('topicSearchInput');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
  if (e.target.dataset.sim) {
    state.simScores[e.target.dataset.sim] = parseInt(e.target.value, 10);
    renderAll();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'prioSelect') {
    state.prioFilter = e.target.value;
    renderAll();
  }
  if (e.target.id === 'statusSelect') {
    state.statusFilter = e.target.value;
    renderAll();
  }
  if (e.target.dataset.planChk) {
    const id = e.target.dataset.planChk;
    if (e.target.checked) {
      if (!state.checkedPlan.includes(id)) state.checkedPlan.push(id);
    } else {
      state.checkedPlan = state.checkedPlan.filter(x => x !== id);
    }
    saveState();
    renderAll();
  }
  if (e.target.dataset.pyqChk) {
    const id = e.target.dataset.pyqChk;
    if (e.target.checked) {
      if (!state.solvedPyqs.includes(id)) state.solvedPyqs.push(id);
      showToast('PYQ Marked as Solved!');
    } else {
      state.solvedPyqs = state.solvedPyqs.filter(x => x !== id);
    }
    saveState();
    renderAll();
  }
});

loadState();
renderAll();
</script>
</body>
</html>
