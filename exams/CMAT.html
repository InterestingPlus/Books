nt / Lavish."}, {"q": "Antonym of 'LUCID' (clear):", "steps": "Step 1: Lucid = clear and easy to understand.\nStep 2: Opposite = Obscure / Ambiguous."}], "mcqs": [{"q": "Choose the Antonym of 'OPTIMISTIC':", "options": ["Hopeful", "Pessimistic", "Cheerful", "Positive"], "ans": 1, "exp": "Optimistic (ashawadi) ka opposite Pessimistic (nirashawadi) hota hai."}, {"q": "Choose the Antonym of 'ABUNDANT':", "options": ["Plentiful", "Scarce", "Ample", "Rich"], "ans": 1, "exp": "Abundant (bahut zyada) ka opposite Scarce (kam/durlabh)."}, {"q": "Choose the Antonym of 'TRANSPARENT':", "options": ["Clear", "Lucid", "Opaque", "Visible"], "ans": 2, "exp": "Transparent ka opposite Opaque hota hai."}]}, {"id": "lc-jumbled-para", "section": "lc", "title": "Jumbled Para", "priority": "High", "expectedQs": "2 Qs", "definition": "4 ya 5 shuffled sentences (P, Q, R, S) ko coherent paragraph order mein lagana hota hai.", "examFocus": "CMAT mein options diye hote hain—isliye poora order manually banane ke bajaye sirf **Opening Sentence** aur **Mandatory Pair** (Noun → Pronoun, Cause → Effect) dhundh kar options eliminate karein!", "formulas": ["Opening sentence independent hota hai (usually introduces Noun, never starts with 'He/It/However/Therefore')", "Mandatory Pair: Full name pehle ('National Testing Agency') → Short form baad mein ('NTA')", "Chronology: Earlier year → Later year"], "examples": [{"q": "Arrange: (P) It conducts CMAT every year. (Q) NTA is an autonomous testing body. (R) Thousands of MBA/MCA aspirants appear for it.", "steps": "Step 1: Q introduces 'NTA' (opening).\nStep 2: P uses 'It' for NTA and introduces CMAT.\nStep 3: R refers to CMAT ('for it') ⇒ Order: Q-P-R."}, {"q": "Connector clue: 'However' wala sentence kabhi pehla nahi hota—wo kisi contrast sentence ke turant baad aata hai."}], "mcqs": [{"q": "Arrange: (A) Consequently, sales doubled. (B) The firm launched a mobile app in 2025. (C) Customers loved its fast checkout.", "options": ["A-B-C", "B-C-A", "C-B-A", "B-A-C"], "ans": 1, "exp": "Launch (B) → Customer reaction (C) → Result 'Consequently' (A) ⇒ B-C-A."}, {"q": "Kaunsa sentence Para-Jumble ka OPENING sentence nahi ho sakta?", "options": ["India's IT sector grew rapidly.", "However, challenges remain in rural areas.", "Startups drive modern innovation.", "CMAT tests five core skills."], "ans": 1, "exp": "'However' contrast connector hai jo kisi pichle sentence par depend karta hai."}, {"q": "Arrange: (P) This shift saves fuel. (Q) Many cities now run electric buses. (R) It also lowers urban noise.", "options": ["P-Q-R", "Q-P-R", "R-Q-P", "Q-R-P"], "ans": 1, "exp": "Q introduces 'electric buses' → P refers to 'This shift' → R adds 'It also' ⇒ Q-P-R."}]}, {"id": "lc-sentence-correction", "section": "lc", "title": "Sentence Correction", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Sentence ka ek part underlined hota hai aur aapko 4 options mein se grammatically accurate aur concise replacement choose karna hota hai.", "examFocus": "Check 4 things in order: (1) Subject-Verb agreement, (2) Tense consistency, (3) Modifier placement, (4) Conciseness (no wordiness).", "formulas": ["Dangling Modifier fix: Opening phrase ke turant baad wahi subject aana chahiye jo action kar raha hai", "Comparison must be apples-to-apples: 'The climate of Rajkot is hotter than that of Shimla' (not 'than Shimla')"], "examples": [{"q": "Correct: 'Walking in the park, a snake bit him.'", "steps": "Step 1: 'Walking in the park' ka subject 'snake' nahi, 'he' hai.\nStep 2: Correct = 'While he was walking in the park, a snake bit him.'"}, {"q": "Correct: 'He is senior than me.'", "steps": "Step 1: Senior/Junior/Prefer ke saath 'to' lagta hai, 'than' nahi.\nStep 2: 'He is senior to me.'"}], "mcqs": [{"q": "Choose the correct sentence:", "options": ["She prefers tea than coffee.", "She prefers tea to coffee.", "She prefers tea over than coffee.", "She is preferring tea to coffee."], "ans": 1, "exp": "'Prefer' ke saath hamesha 'to' use hota hai."}, {"q": "Choose the correct sentence:", "options": ["The population of Gujarat is larger than Goa.", "The population of Gujarat is larger than that of Goa.", "Population of Gujarat are larger than Goa.", "Gujarat population is more larger than Goa."], "ans": 1, "exp": "Population ko population ('that of Goa') se compare karna zaroori hai."}, {"q": "Correct the underlined part: 'Hardly had I reached the station THAN the train left.'", "options": ["when", "then", "before", "no change"], "ans": 0, "exp": "'Hardly/Scarcely... when' aur 'No sooner... than' fixed correlative pairs hain."}]}, {"id": "lc-one-word", "section": "lc", "title": "One-Word Substitution", "priority": "Medium", "expectedQs": "1 Q", "definition": "Ek lambi phrase ya definition ko ek single precise English word se replace karna.", "examFocus": "Phobias (fear), Manias (obsession), Cracies (government types: Democracy, Autocracy, Bureaucracy), aur Cides (killing) ke root words yaad kar lein.", "formulas": ["-cracy = rule (Autocracy = one person, Oligarchy = few, Plutocracy = rich)", "-phile = lover (Bibliophile = book lover, Philanthropist = mankind lover)", "Omni- = all (Omniscient = all-knowing, Omnipotent = all-powerful)"], "examples": [{"q": "A person who loves collecting and reading books:", "steps": "Step 1: Biblio (book) + phile (lover) = Bibliophile."}, {"q": "A life history of a person written by himself:", "steps": "Step 1: Auto (self) + bio (life) + graphy (writing) = Autobiography."}], "mcqs": [{"q": "One who knows everything is called:", "options": ["Omnipotent", "Omniscient", "Omnipresent", "Optimist"], "ans": 1, "exp": "Omni (all) + scient (knowing) = Omniscient."}, {"q": "A person who does not believe in the existence of God:", "options": ["Theist", "Atheist", "Agnostic", "Altruist"], "ans": 1, "exp": "Atheist = one who denies God's existence (Agnostic = unsure)."}, {"q": "A cure for all diseases:", "options": ["Antibiotic", "Panacea", "Placebo", "Antidote"], "ans": 1, "exp": "Pan (all) + acea (cure) = Panacea."}]}, {"id": "lc-idioms", "section": "lc", "title": "Idioms", "priority": "Medium", "expectedQs": "1 Q", "definition": "Idioms aise fixed expressions hain jinka figurative meaning unke literal words se alag hota hai (e.g., 'Break the ice' = start a conversation).", "examFocus": "CMAT mein everyday business aur classic English idioms (burn the midnight oil, once in a blue moon, bite the bullet, hit the nail on the head) baar-baar repeat hote hain.", "formulas": ["Literal meaning wala option hamesha trap hota hai — figurative meaning chunein", "Sentence context mein padhne se idiom ka positive/negative sense clear ho jata hai"], "examples": [{"q": "Meaning of 'Burn the midnight oil':", "steps": "Step 1: Figurative meaning = Raat der tak mehnat se padhna ya kaam karna."}, {"q": "Meaning of 'A blessing in disguise':", "steps": "Step 1: Jo cheez shuru mein buri lage par baad mein achhi sabit ho."}], "mcqs": [{"q": "Meaning of the idiom 'Once in a blue moon':", "options": ["Every night", "Very rarely", "Regularly", "During a full moon"], "ans": 1, "exp": "'Once in a blue moon' ka matlab bahut kam / rarely hota hai."}, {"q": "Meaning of 'Hit the nail on the head':", "options": ["Hurt yourself", "Describe exactly what is causing a situation", "Work as a carpenter", "Fail badly"], "ans": 1, "exp": "Bilkul sahi aur exact point pakadna."}, {"q": "Meaning of 'Spill the beans':", "options": ["Waste food", "Reveal a secret", "Start cooking", "Make a mess"], "ans": 1, "exp": "'Spill the beans' = koi secret reveal kar dena."}]}, {"id": "lc-phrases", "section": "lc", "title": "Phrases", "priority": "Medium", "expectedQs": "1 Q", "definition": "Phrasal Verbs (Verb + Preposition, e.g., 'give up', 'put off', 'call off') aur prepositional phrases jo Fill-in-the-Blanks aur Cloze Tests mein aate hain.", "examFocus": "High-frequency phrasal verbs yaad rakhein: Call off (cancel), Put off (postpone), Look into (investigate), Break down (stop working), Turn down (reject).", "formulas": ["Call off = Cancel | Put off = Postpone | Put out = Extinguish", "Give up = Quit | Give in = Surrender | Turn down = Reject", "Look after = Take care of | Look into = Investigate | Look up to = Respect"], "examples": [{"q": "Fill in: 'The meeting was ____ due to heavy rain.' (cancelled)", "steps": "Step 1: Cancel ke liye phrasal verb = 'called off'."}, {"q": "Fill in: 'She ____ the job offer because the location was too far.' (rejected)", "steps": "Step 1: Reject ke liye phrasal verb = 'turned down'."}], "mcqs": [{"q": "The police promised to ____ the matter immediately.", "options": ["look after", "look into", "look down", "look out"], "ans": 1, "exp": "'Look into' ka matlab investigate karna hota hai."}, {"q": "Never ____ on your CMAT preparation even if a mock score is low.", "options": ["give up", "give away", "give out", "give off"], "ans": 0, "exp": "'Give up' = haar maanna / quit karna."}, {"q": "Meaning of 'Put off':", "options": ["Wear clothes", "Postpone", "Cancel permanently", "Extinguish"], "ans": 1, "exp": "'Put off' ka matlab postpone (aage badhana) hota hai."}]}, {"id": "ga-literature", "section": "ga", "title": "Literature", "priority": "Medium", "expectedQs": "1 Q", "definition": "Famous Indian & International Books, Authors, Booker Prize / Jnanpith / Sahitya Akademi award winners, aur classic literary works.", "examFocus": "Pichle 12 mahine ki award-winning books + iconic Indian classics (Arthashastra, Discovery of India, Wings of Fire, Train to Pakistan, God of Small Things) zaroor revise karein.", "formulas": ["Classics: Arthashastra (Kautilya), Discovery of India (Nehru), Wings of Fire (APJ Abdul Kalam)", "Modern Indian: The God of Small Things (Arundhati Roy), The White Tiger (Aravind Adiga), Midnight's Children (Salman Rushdie)", "Awards: Booker Prize (English fiction), Jnanpith Award (India's highest literary honour)"], "examples": [{"q": "Who wrote 'The Discovery of India'?", "steps": "Step 1: Written by Jawaharlal Nehru during his imprisonment at Ahmednagar Fort (1942–46)."}, {"q": "Which award is India's highest literary honour?", "steps": "Step 1: Jnanpith Award (instituted in 1961)."}], "mcqs": [{"q": "Who is the author of 'Wings of Fire'?", "options": ["Vikram Sarabhai", "Dr. A.P.J. Abdul Kalam", "Ratan Tata", "C.V. Raman"], "ans": 1, "exp": "'Wings of Fire' Dr. A.P.J. Abdul Kalam ki autobiography hai (co-authored with Arun Tiwari)."}, {"q": "'The God of Small Things' won the Booker Prize for which Indian author?", "options": ["Jhumpa Lahiri", "Arundhati Roy", "Kiran Desai", "Anita Desai"], "ans": 1, "exp": "Arundhati Roy ne 1997 mein Booker Prize jeeta tha."}, {"q": "Who wrote the ancient Sanskrit treatise 'Arthashastra'?", "options": ["Kalidasa", "Kautilya (Chanakya)", "Panini", "Valmiki"], "ans": 1, "exp": "Kautilya (Chanakya) ne Arthashastra likha tha."}]}, {"id": "ga-trade-awareness", "section": "ga", "title": "Trade Awareness", "priority": "High", "expectedQs": "1-2 Qs", "definition": "International trade bodies (WTO, IMF, World Bank), Balance of Payments, Exports/Imports, FTAs (Free Trade Agreements), aur Indian corporate/brand taglines & mergers.", "examFocus": "WTO headquarters (Geneva), RBI/SEBI roles, aur recent India FTAs / major business acquisitions par CMAT mein direct questions aate hain.", "formulas": ["WTO HQ: Geneva, Switzerland | IMF & World Bank HQ: Washington, D.C.", "SEBI = Stock market regulator | RBI = Central bank & monetary policy | IRDAI = Insurance", "Trade Deficit = Imports > Exports | Trade Surplus = Exports > Imports"], "examples": [{"q": "World Trade Organization (WTO) ka headquarters kahan hai?", "steps": "Step 1: Geneva, Switzerland (established in 1995 replacing GATT)."}, {"q": "India mein capital/stock markets ko kaun regulate karta hai?", "steps": "Step 1: SEBI (Securities and Exchange Board of India), HQ in Mumbai."}], "mcqs": [{"q": "Where is the headquarters of the World Trade Organization (WTO)?", "options": ["New York", "Geneva", "Paris", "London"], "ans": 1, "exp": "WTO ka headquarters Geneva, Switzerland mein hai."}, {"q": "Which body regulates the securities and stock market in India?", "options": ["RBI", "SEBI", "NABARD", "TRAI"], "ans": 1, "exp": "SEBI (Securities and Exchange Board of India) stock market regulator hai."}, {"q": "Jab kisi desh ke Imports uske Exports se zyada hon, toh use kya kehte hain?", "options": ["Trade Surplus", "Trade Deficit", "Fiscal Surplus", "Inflation"], "ans": 1, "exp": "Imports > Exports = Trade Deficit."}]}, {"id": "ga-constitution", "section": "ga", "title": "Indian Constitution", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Fundamental Rights (Part III), DPSP (Part IV), Fundamental Duties (Art 51A), Parliament, President/PM powers, aur landmark Constitutional Amendments.", "examFocus": "Key Articles (14, 17, 19, 21, 32, 44, 356, 368) aur 42nd/44th/73rd/101st (GST) Amendments zaroor yaad rakhein.", "formulas": ["Fundamental Rights: Articles 12–35 (Part III) | Art 32 = Heart & Soul (Dr. Ambedkar)", "42nd Amendment (1976) = Mini Constitution (added Socialist, Secular, Integrity)", "101st Amendment = GST | 73rd = Panchayati Raj | 86th = Right to Education (Art 21A)"], "examples": [{"q": "Article 17 of the Indian Constitution kis cheez se related hai?", "steps": "Step 1: Abolition of Untouchability."}, {"q": "Constitutional Amendment procedure kis Article mein diya gaya hai?", "steps": "Step 1: Article 368 (borrowed from South Africa)."}], "mcqs": [{"q": "Which Article of the Indian Constitution guarantees Right to Life and Personal Liberty?", "options": ["Article 14", "Article 19", "Article 21", "Article 32"], "ans": 2, "exp": "Article 21 Right to Life and Personal Liberty guarantee karta hai."}, {"q": "Which Constitutional Amendment introduced the Goods and Services Tax (GST) in India?", "options": ["99th", "100th", "101st", "102nd"], "ans": 2, "exp": "101st Constitutional Amendment Act (2016) ne GST implement kiya."}, {"q": "Dr. B.R. Ambedkar ne kis Article ko 'Heart and Soul of the Constitution' kaha tha?", "options": ["Article 14", "Article 21", "Article 32", "Article 51A"], "ans": 2, "exp": "Article 32 (Right to Constitutional Remedies)."}]}, {"id": "ga-politics", "section": "ga", "title": "Politics", "priority": "Medium", "expectedQs": "1 Q", "definition": "Indian Parliamentary system (Lok Sabha, Rajya Sabha), Election Commission, Constitutional Bodies (CAG, UPSC, Finance Commission), aur key governance updates.", "examFocus": "Rajya Sabha vs Lok Sabha tenure/minimum age, Money Bill rule (only Lok Sabha), aur current constitutional heads check karein.", "formulas": ["Min Age: Lok Sabha = 25 yrs | Rajya Sabha = 30 yrs | President/Governor = 35 yrs", "Money Bill (Art 110): Sirf Lok Sabha mein introduce ho sakta hai", "Election Commission: Article 324 | CAG: Article 148 | Finance Commission: Article 280"], "examples": [{"q": "Rajya Sabha ke member banne ki minimum age kya hai?", "steps": "Step 1: 30 years (Lok Sabha = 25 years)."}, {"q": "Parliament ke joint sitting ki chairmanship kaun karta hai?", "steps": "Step 1: Speaker of the Lok Sabha (summoned by President under Art 108)."}], "mcqs": [{"q": "Who is the ex-officio Chairman of the Rajya Sabha?", "options": ["President of India", "Vice President of India", "Prime Minister", "Speaker"], "ans": 1, "exp": "Vice President of India Rajya Sabha ke ex-officio Chairman hote hain."}, {"q": "Minimum age to contest Lok Sabha elections in India:", "options": ["21 years", "25 years", "30 years", "35 years"], "ans": 1, "exp": "Lok Sabha ke liye minimum age 25 years hai."}, {"q": "Money Bill sirf kis house mein introduce kiya ja sakta hai?", "options": ["Rajya Sabha", "Lok Sabha", "Either house", "Supreme Court"], "ans": 1, "exp": "Article 110 ke mutabik Money Bill sirf Lok Sabha mein introduce hota hai."}]}, {"id": "ga-geography", "section": "ga", "title": "Geography", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Indian Rivers, National Parks, Mountain Passes, Soils, Climate, aur World Geography (Capitals, Currencies, Straits, Continents).", "examFocus": "Gujarat & India ke famous National Parks (Gir, Kaziranga, Jim Corbett), West-flowing rivers (Narmada, Tapi), aur Tropic of Cancer (8 Indian states including Gujarat!) zaroor yaad rakhein.", "formulas": ["Tropic of Cancer (23.5°N) passes through 8 states: Gujarat, Rajasthan, MP, Chhattisgarh, Jharkhand, WB, Tripura, Mizoram", "West-flowing major rivers: Narmada, Tapi, Sabarmati, Mahi (fall into Arabian Sea)", "Longest river in India: Ganga | Longest Peninsular river: Godavari"], "examples": [{"q": "Asiatic Lions India mein naturally sirf kis National Park mein milte hain?", "steps": "Step 1: Gir National Park, Gujarat."}, {"q": "Kaunsi rivers West direction mein behkar Arabian Sea mein milti hain?", "steps": "Step 1: Narmada aur Tapi (Rift Valley rivers)."}], "mcqs": [{"q": "Which of the following Indian rivers flows westward into the Arabian Sea?", "options": ["Godavari", "Krishna", "Narmada", "Kaveri"], "ans": 2, "exp": "Narmada aur Tapi westward flow karke Arabian Sea mein girti hain."}, {"q": "Kaziranga National Park (famous for One-Horned Rhinoceros) kis state mein hai?", "options": ["Gujarat", "Assam", "Uttarakhand", "Kerala"], "ans": 1, "exp": "Kaziranga National Park Assam mein located hai."}, {"q": "Tropic of Cancer India ke kitne states se guzarti hai?", "options": ["6", "7", "8", "9"], "ans": 2, "exp": "Total 8 states (starting from Gujarat in the west to Mizoram in the east)."}]}, {"id": "ga-current-affairs", "section": "ga", "title": "Current Affairs (National & International Economy)", "priority": "Very High", "expectedQs": "10-12 Qs", "definition": "General Awareness ka sabse bada hissa (~60% weightage): National/International events, Union Budget, RBI Monetary Policy, Summits (G20, BRICS, COP), aur Major Schemes.", "examFocus": "CMAT 2027 (11 Feb 2027) ke liye **August 2026 se January 2027** (6 mahine) ke monthly current affairs sabse critical hain—plus Union Budget 2027 highlights (1 Feb 2027) par 1–2 questions aa sakte hain!", "formulas": ["Focus Window: Aug 2026 – Jan 2027 (6 months prior to Feb 2027 exam)", "Key Buckets: Economic/RBI updates, Summits & Hosts, Defence Exercises, Space (ISRO), Awards, Govt Schemes"], "examples": [{"q": "RBI Repo Rate badhane se economy mein kya effect hota hai?", "steps": "Step 1: Loans mehenge hote hain → money supply kam hoti hai → Inflation control hota hai."}, {"q": "GDP aur GNP mein main difference kya hai?", "steps": "Step 1: GDP = Domestic territory ke andar production; GNP = GDP + Net Factor Income from Abroad."}], "mcqs": [{"q": "RBI jis rate par commercial banks ko short-term loan deta hai, use kya kehte hain?", "options": ["Reverse Repo Rate", "Repo Rate", "CRR", "SLR"], "ans": 1, "exp": "Repo Rate = rate at which RBI lends short-term funds to commercial banks."}, {"q": "CMAT 2027 (11 Feb 2027) ke liye Current Affairs ka sabse high-yield window kaunsa hai?", "options": ["2023–2024", "Aug 2026 – Jan 2027", "Only Feb 2027", "2020–2022"], "ans": 1, "exp": "Exam se pichle 6 mahine (Aug 2026 – Jan 2027) se sabse zyada questions aate hain."}, {"q": "ISRO ka headquarters kahan located hai?", "options": ["Sriharikota", "Bengaluru", "Ahmedabad", "Thiruvananthapuram"], "ans": 1, "exp": "ISRO HQ Bengaluru mein hai (SAC Ahmedabad mein aur launchpad Sriharikota mein hai)."}]}, {"id": "ga-culture", "section": "ga", "title": "Culture", "priority": "Medium", "expectedQs": "1 Q", "definition": "Indian Classical Dances, Folk Dances, UNESCO World Heritage Sites, Festivals, Classical Music Gharanas, aur Architecture.", "examFocus": "8 Classical Dances & their states + UNESCO sites in Gujarat (Rani ki Vav, Dholavira, Champaner-Pavagadh, Historic City of Ahmedabad) zaroor yaad rakhein!", "formulas": ["8 Classical Dances: Bharatanatyam (TN), Kathak (UP/North), Kathakali & Mohiniyattam (Kerala), Kuchipudi (AP), Odissi (Odisha), Manipuri (Manipur), Sattriya (Assam)", "Gujarat UNESCO Sites: Historic City of Ahmedabad, Dholavira, Rani ki Vav (Patan), Champaner-Pavagadh"], "examples": [{"q": "Sattriya classical dance kis Indian state se belongs karta hai?", "steps": "Step 1: Assam (introduced by Srimanta Sankardev)."}, {"q": "Dholavira (UNESCO site) kis ancient civilization ka major city tha?", "steps": "Step 1: Indus Valley (Harappan) Civilization, located in Kutch, Gujarat."}], "mcqs": [{"q": "Kuchipudi classical dance kis state ka hai?", "options": ["Tamil Nadu", "Kerala", "Andhra Pradesh", "Odisha"], "ans": 2, "exp": "Kuchipudi Andhra Pradesh ka classical dance hai."}, {"q": "Rani ki Vav (featured on ₹100 note) Gujarat ke kis district mein hai?", "options": ["Kutch", "Patan", "Vadodara", "Junagadh"], "ans": 1, "exp": "Rani ki Vav Patan, Gujarat mein situated hai."}, {"q": "Bihu festival kis Indian state mein manaya jata hai?", "options": ["Punjab", "Assam", "Bihar", "Odisha"], "ans": 1, "exp": "Bihu Assam ka major harvest festival hai."}]}, {"id": "ga-personalities", "section": "ga", "title": "Personalities in News", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Recent major appointments (CEOs, CJI, RBI Governor, UN/Global heads), Nobel Prize & Padma Award winners, aur eminent leaders in news.", "examFocus": "Exam se 15 din pehle ek 1-page 'Who's Who 2026–27' sheet revise karein (Global Tech CEOs, Indian Constitutional Heads, Nobel 2026 winners).", "formulas": ["Categories to track: Constitutional Heads (CJI, CEC, CAG), Business/Tech CEOs, Nobel & Bharat Ratna/Padma Awardees, Global Org Heads"], "examples": [{"q": "Indian Space Programme ke 'Father' kise kaha jata hai?", "steps": "Step 1: Dr. Vikram Sarabhai (born in Ahmedabad, Gujarat)."}, {"q": "White Revolution (Operation Flood / Amul) ke Father kise mana jata hai?", "steps": "Step 1: Dr. Verghese Kurien."}], "mcqs": [{"q": "Who is known as the 'Father of the White Revolution' in India?", "options": ["M.S. Swaminathan", "Dr. Verghese Kurien", "Tribhuvandas Patel", "Homi Bhabha"], "ans": 1, "exp": "Dr. Verghese Kurien ko Father of White Revolution (Operation Flood) kaha jata hai."}, {"q": "Who is known as the 'Father of the Green Revolution' in India?", "options": ["M.S. Swaminathan", "Verghese Kurien", "Vikram Sarabhai", "C.V. Raman"], "ans": 0, "exp": "Dr. M.S. Swaminathan India mein Green Revolution ke architect the."}, {"q": "Nobel Prize kitne total fields mein diya jata hai?", "options": ["5", "6", "7", "4"], "ans": 1, "exp": "6 fields: Physics, Chemistry, Medicine, Literature, Peace, aur Economic Sciences."}]}, {"id": "ga-economics", "section": "ga", "title": "Economics", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Basic Macroeconomics & Indian Economy: Inflation (CPI/WPI), Fiscal Deficit, RBI tools (CRR, SLR, Repo), GST slabs, aur NITI Aayog.", "examFocus": "Direct vs Indirect taxes, RBI monetary policy instruments, aur NITI Aayog (replaced Planning Commission in 2015) par classic MCQs bante hain.", "formulas": ["Direct Taxes: Income Tax, Corporate Tax | Indirect Taxes: GST, Customs Duty", "Inflation indices: CPI (Consumer / Retail) & WPI (Wholesale)", "Fiscal Deficit = Total Expenditure − Total Receipts (excluding borrowings)"], "examples": [{"q": "GST kis type ka tax hai — Direct ya Indirect?", "steps": "Step 1: Indirect, destination-based consumption tax."}, {"q": "NITI Aayog ke Chairperson kaun hote hain?", "steps": "Step 1: Prime Minister of India (ex-officio)."}], "mcqs": [{"q": "Inme se kaunsa DIRECT tax hai?", "options": ["GST", "Customs Duty", "Income Tax", "Excise Duty"], "ans": 2, "exp": "Income Tax direct tax hai; baaki teeno indirect taxes hain."}, {"q": "NITI Aayog ne 2015 mein kis body ko replace kiya tha?", "options": ["Finance Commission", "Planning Commission", "RBI", "SEBI"], "ans": 1, "exp": "NITI Aayog ne 1 Jan 2015 ko Planning Commission ko replace kiya."}, {"q": "CRR (Cash Reserve Ratio) commercial banks ko kiske paas rakhna hota hai?", "options": ["SEBI", "RBI", "Ministry of Finance", "Own vault as gold"], "ans": 1, "exp": "CRR cash form mein RBI ke paas maintain kiya jata hai."}]}, {"id": "ga-history", "section": "ga", "title": "History", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Ancient India (Indus Valley, Maurya, Gupta), Medieval India (Delhi Sultanate, Mughals), aur Modern Indian Freedom Struggle (1857–1947).", "examFocus": "Modern History (1885 INC formation se 1947 Independence tak — Dandi March 1930, Quit India 1942, Champaran 1917) sabse zyada pucha jata hai.", "formulas": ["Key Freedom Milestones: 1857 Revolt → 1885 INC → 1919 Jallianwala Bagh → 1920 Non-Cooperation → 1930 Dandi March → 1942 Quit India → 1947 Independence", "Golden Age of Ancient India = Gupta Period"], "examples": [{"q": "Dandi March (Salt Satyagraha) Mahatma Gandhi ne kab aur kahan se shuru kiya tha?", "steps": "Step 1: 12 March 1930 ko Sabarmati Ashram (Ahmedabad) se Dandi tak."}, {"q": "Indian National Congress (INC) ki sthapna kab hui thi?", "steps": "Step 1: 1885 mein (founded by A.O. Hume; first president W.C. Bonnerjee)."}], "mcqs": [{"q": "Quit India Movement kis saal launch hua tha?", "options": ["1930", "1935", "1942", "1945"], "ans": 2, "exp": "8 August 1942 ko Mahatma Gandhi ne Quit India Movement ('Do or Die') launch kiya."}, {"q": "Indus Valley Civilization ka famous dockyard site 'Lothal' kis state mein hai?", "options": ["Rajasthan", "Gujarat", "Punjab", "Haryana"], "ans": 1, "exp": "Lothal Gujarat (Bhal region) mein located hai."}, {"q": "Battle of Plassey kis saal ladi gayi thi?", "options": ["1757", "1764", "1857", "1707"], "ans": 0, "exp": "Battle of Plassey 23 June 1757 ko hui thi."}]}, {"id": "ga-sports", "section": "ga", "title": "Sports News", "priority": "Medium", "expectedQs": "1 Q", "definition": "Major Sports Tournaments (Olympics, Cricket World Cups, Grand Slams, Asian Games, Chess), Trophies/Cups, aur Major Dhyan Chand Khel Ratna Awards.", "examFocus": "Sports-to-Trophy matching (Ranji/Deodhar=Cricket, Thomas/Uber=Badminton, Davis=Tennis, Durand/Santosh=Football) aur recent 2026 tournament winners revise karein.", "formulas": ["Badminton: Thomas Cup (Men), Uber Cup (Women) | Tennis: Davis Cup, 4 Grand Slams", "Football: Durand Cup, Santosh Trophy, FIFA | Cricket: Ranji, Irani, Duleep, Vijay Hazare", "India's Highest Sports Award: Major Dhyan Chand Khel Ratna Award"], "examples": [{"q": "Thomas Cup kis sport se associated hai?", "steps": "Step 1: Men's International Badminton."}, {"q": "Wimbledon Tennis tournament kis court surface par khela jata hai?", "steps": "Step 1: Grass Court (French Open = Clay; US & Australian Open = Hard Court)."}], "mcqs": [{"q": "Durand Cup aur Santosh Trophy kis sport se jude hain?", "options": ["Hockey", "Cricket", "Football", "Badminton"], "ans": 2, "exp": "Durand Cup (Asia's oldest football tournament) aur Santosh Trophy Football se jude hain."}, {"q": "French Open (Roland-Garros) kis surface par khela jata hai?", "options": ["Grass", "Clay", "Hard Court", "Carpet"], "ans": 1, "exp": "French Open Red Clay court par khela jata hai."}, {"q": "National Sports Day India mein 29 August ko kiske birthday par manaya jata hai?", "options": ["Milkha Singh", "Major Dhyan Chand", "Kapil Dev", "P.T. Usha"], "ans": 1, "exp": "Hockey wizard Major Dhyan Chand ke birthday (29 August) par."}]}, {"id": "ga-science", "section": "ga", "title": "Science in Everyday Life", "priority": "Medium", "expectedQs": "1-2 Qs", "definition": "Basic Physics, Chemistry, aur Biology jo daily life mein use hoti hai: Vitamins & deficiency diseases, Human body systems, Chemical names (Baking Soda, Washing Soda), SI units, aur Space/AI tech.", "examFocus": "Vitamins table (A, B1, C, D, K), common chemical formulas, aur SI units par 1–2 easy questions aksar aate hain.", "formulas": ["Vitamins: A (Night Blindness), B1 (Beriberi), C (Scurvy), D (Rickets), K (Blood clotting)", "Baking Soda = NaHCO3 | Washing Soda = Na2CO3 | Dry Ice = Solid CO2", "SI Units: Force = Newton, Power = Watt, Current = Ampere, Resistance = Ohm"], "examples": [{"q": "Vitamin C ki kami se kaunsi disease hoti hai?", "steps": "Step 1: Scurvy (bleeding gums)."}, {"q": "Dry Ice chemically kya hoti hai?", "steps": "Step 1: Solid Carbon Dioxide (CO2)."}], "mcqs": [{"q": "Rickets (haddiyon ki kamzori) kis Vitamin ki deficiency se hota hai?", "options": ["Vitamin A", "Vitamin B12", "Vitamin C", "Vitamin D"], "ans": 3, "exp": "Vitamin D ki kami se bacchon mein Rickets hota hai."}, {"q": "Electric Current ki SI unit kya hai?", "options": ["Volt", "Watt", "Ampere", "Ohm"], "ans": 2, "exp": "Electric current = Ampere; Voltage = Volt; Power = Watt; Resistance = Ohm."}, {"q": "Human blood ka Universal Donor blood group kaunsa hai?", "options": ["AB+", "O−", "A+", "B−"], "ans": 1, "exp": "O negative (O−) Universal Donor aur AB+ Universal Recipient hota hai."}]}, {"id": "ie-concepts", "section": "ie", "title": "Concepts of Entrepreneurship", "priority": "Very High", "expectedQs": "2 Qs", "definition": "Entrepreneurship ka matlab kisi problem ya market opportunity ko pehchankar, resources organize karke, calculated risk ke saath naya value-creating venture build karna. Word 'Entrepreneur' French word 'Entreprendre' (to undertake) se aaya hai.", "examFocus": "Entrepreneur vs Intrapreneur vs Manager ka difference, aur Innovation vs Invention ka farq CMAT mein baar-baar pucha jata hai.", "formulas": ["Invention = Creating something brand new | Innovation = Commercializing an idea into market value", "Entrepreneur = Starts own business, bears financial risk | Intrapreneur = Innovates INSIDE an existing company", "4 Core Pillars: Opportunity recognition, Resource mobilization, Risk-taking, Value creation"], "examples": [{"q": "Google ke andar ek employee ne Gmail banaya. Wo employee kya kehlayega?", "steps": "Step 1: Existing company ke andar innovate kiya (no personal financial risk) ⇒ Intrapreneur."}, {"q": "Word 'Entrepreneur' kis language ke word 'Entreprendre' se bana hai?", "steps": "Step 1: French ('to undertake')."}], "mcqs": [{"q": "An employee who acts like an entrepreneur within an established organization is called:", "options": ["Venture Capitalist", "Intrapreneur", "Angel Investor", "Franchisee"], "ans": 1, "exp": "Intrapreneur existing company ke resources use karke naye products/initiatives build karta hai."}, {"q": "The term 'Entrepreneur' is derived from which French word?", "options": ["Entreprendre", "Entreprise", "Innovare", "Mercator"], "ans": 0, "exp": "French word 'Entreprendre' means 'to undertake'."}, {"q": "What is the key difference between Invention and Innovation?", "options": ["Both are identical", "Innovation focuses on commercial/practical application of an idea", "Invention always makes money", "Innovation needs no market"], "ans": 1, "exp": "Invention naya idea/tech create karna hai; Innovation use market mein viable product banana hai."}]}, {"id": "ie-overview", "section": "ie", "title": "Overview of Entrepreneurship", "priority": "Very High", "expectedQs": "1-2 Qs", "definition": "Startup lifecycle (Ideation → MVP → Validation → Seed → Growth → Scale/IPO), Startup funding stages, aur Startup jargons (Unicorn, Decacorn, Bootstrapping, Burn Rate, Pivot).", "examFocus": "Unicorn ($1B+), Decacorn ($10B+), Bootstrapping, MVP (Minimum Viable Product), aur Angel vs VC funding CMAT ke most repeated MCQs hain!", "formulas": ["Bootstrapping = Self-funding without external investors", "MVP (Minimum Viable Product) = Basic working version to test market demand quickly", "Unicorn = Private startup valued ≥ $1 Billion | Decacorn ≥ $10 Billion", "Burn Rate = Speed at which a startup spends cash before becoming profitable | Pivot = Changing business model"], "examples": [{"q": "Agar koi founder apni personal savings se startup start kare bina VC funding ke, toh ise kya kehte hain?", "steps": "Step 1: Bootstrapping."}, {"q": "Seed funding stage par aam taur par kaun invest karta hai?", "steps": "Step 1: Angel Investors, Friends & Family, aur Seed Funds."}], "mcqs": [{"q": "A privately held startup valued at over $1 Billion is known as a:", "options": ["Decacorn", "Unicorn", "Gazelle", "Soonicorn"], "ans": 1, "exp": "$1B+ = Unicorn; $10B+ = Decacorn."}, {"q": "Starting and growing a company using only personal finances and operating revenue is called:", "options": ["Crowdfunding", "Bootstrapping", "Series A", "IPO"], "ans": 1, "exp": "Bootstrapping = self-funded growth without outside equity."}, {"q": "In startup terminology, 'MVP' stands for:", "options": ["Most Valuable Partner", "Minimum Viable Product", "Maximum Venture Profit", "Market Value Price"], "ans": 1, "exp": "MVP = Minimum Viable Product, used to validate ideas with early adopters."}]}, {"id": "ie-evolution-india", "section": "ie", "title": "Evolution of Entrepreneurship in India", "priority": "High", "expectedQs": "1-2 Qs", "definition": "India mein entrepreneurship ka safar: Pre-independence industrialists (Tata, Birla, Godrej) → 1991 LPG Reforms → IT boom (Infosys, Wipro) → Digital India & Startup India (2016) ecosystem.", "examFocus": "1991 Economic Liberalization (LPG), **Startup India (16 Jan 2016)**, **DPIIT recognition**, **MUDRA Yojana**, aur **Atal Innovation Mission (AIM)** dates & facts yaad rakhein!", "formulas": ["1991 Reforms: Liberalization, Privatization, Globalization (opened private enterprise)", "Startup India launched: 16 January 2016 (National Startup Day = 16 Jan)", "DPIIT Startup Criteria: Age ≤ 10 years, Annual Turnover ≤ ₹100 Crore", "MUDRA Loans: Shishu (up to ₹50K), Kishore (₹50K–₹5L), Tarun (₹5L–₹10L/₹20L)"], "examples": [{"q": "National Startup Day India mein har saal kis date ko manaya jata hai?", "steps": "Step 1: 16 January (Startup India launch anniversary, 2016)."}, {"q": "MUDRA Yojana mein ₹50,000 tak ke loan category ko kya kehte hain?", "steps": "Step 1: Shishu category."}], "mcqs": [{"q": "Startup India flagship initiative was launched on:", "options": ["15 August 2015", "16 January 2016", "2 October 2014", "1 July 2017"], "ans": 1, "exp": "16 January 2016 ko Startup India launch hua tha."}, {"q": "Under PM MUDRA Yojana, which category covers loans up to ₹50,000?", "options": ["Shishu", "Kishore", "Tarun", "Udyam"], "ans": 0, "exp": "Shishu = up to ₹50,000; Kishore = ₹50K–₹5L; Tarun = above ₹5L."}, {"q": "Atal Innovation Mission (AIM) kis government body ke under chalta hai?", "options": ["RBI", "NITI Aayog", "SEBI", "Ministry of Defence"], "ans": 1, "exp": "Atal Innovation Mission (Atal Tinkering Labs / Incubation Centres) NITI Aayog ki flagship initiative hai."}]}, {"id": "ie-economic-dev", "section": "ie", "title": "Role of Entrepreneurship in Economic Development", "priority": "High", "expectedQs": "1 Q", "definition": "Entrepreneurs kaise country ke GDP, job creation, capital formation, balanced regional development, exports, aur per-capita income ko boost karte hain.", "examFocus": "Direct conceptual questions: MSMEs India ke GDP aur employment mein massive role play karte hain; entrepreneurs 'job creators' hote hain, 'job seekers' nahi.", "formulas": ["Key Roles: Capital Formation → Employment Generation → Regional Balance → Export Promotion → Innovation & Living Standards", "MSME Classification (Investment / Turnover): Micro (≤1Cr/5Cr), Small (≤10Cr/50Cr), Medium (≤50Cr/250Cr)"], "examples": [{"q": "Backward areas mein industries lagane se entrepreneurship kis economic goal ko help karti hai?", "steps": "Step 1: Balanced Regional Development (reduces urban migration & income disparity)."}, {"q": "Capital formation ka kya matlab hai?", "steps": "Step 1: Idle public savings ko productive business assets aur investments mein channel karna."}], "mcqs": [{"q": "Which of the following is NOT a positive contribution of entrepreneurship to economic development?", "options": ["Employment generation", "Balanced regional growth", "Increasing economic concentration of wealth in one monopoly", "Capital formation"], "ans": 2, "exp": "Entrepreneurship competition badhata hai aur monopoly/concentration of power ko kam karta hai."}, {"q": "Entrepreneurs help in 'Capital Formation' by:", "options": ["Hoarding cash", "Mobilizing idle savings into productive ventures", "Increasing imports only", "Reducing exports"], "ans": 1, "exp": "Idle savings ko equity/debt ke through productive industry mein lagana capital formation hai."}, {"q": "India mein 'Udyam Registration' portal kis sector ke liye hai?", "options": ["Large MNCs only", "MSMEs", "Foreign Banks", "Stock Brokers"], "ans": 1, "exp": "Udyam Portal MSMEs (Micro, Small & Medium Enterprises) ke registration ke liye hai."}]}, {"id": "ie-theories", "section": "ie", "title": "Theories and Models of Entrepreneurship", "priority": "Very High", "expectedQs": "2 Qs", "definition": "Famous economists aur psychologists ke entrepreneurship theories—kaunsa thinker kis theory se juda hai, ye CMAT mein direct MCQ banta hai!", "examFocus": "Joseph Schumpeter (**Creative Destruction / Innovation Theory**), David McClelland (**Need for Achievement — n-Ach**), Frank Knight (**Risk & Uncertainty Bearing**), aur Peter Drucker (**Opportunity & Systematic Innovation**) 100% yaad kar lein!", "formulas": ["Joseph Schumpeter → Innovation Theory & 'Creative Destruction'", "David McClelland → Psychological Theory: Need for Achievement (n-Ach)", "Frank Knight → Risk & Uncertainty Bearing Theory", "Richard Cantillon → First to use term 'Entrepreneur' (Risk-bearer buying at certain price, selling at uncertain price)", "Max Weber → Sociological Theory (Protestant Ethic / Religious & Cultural values)"], "examples": [{"q": "'Creative Destruction' ka concept kis economist ne diya tha?", "steps": "Step 1: Joseph Schumpeter (old industries/tech ko naye innovations replace karte hain)."}, {"q": "David McClelland ki theory mein 'n-Ach' ka full form kya hai?", "steps": "Step 1: Need for Achievement."}], "mcqs": [{"q": "Who coined the famous concept of 'Creative Destruction' in entrepreneurship?", "options": ["Adam Smith", "Joseph Schumpeter", "Peter Drucker", "Max Weber"], "ans": 1, "exp": "Joseph Schumpeter ne Innovation Theory aur Creative Destruction diya tha."}, {"q": "David McClelland's Psychological Theory emphasizes which primary motivator for entrepreneurs?", "options": ["Need for Achievement (n-Ach)", "Fear of failure", "Inherited wealth", "Government subsidies"], "ans": 0, "exp": "McClelland ke mutabik high 'Need for Achievement (n-Ach)' entrepreneurship drive karta hai."}, {"q": "Who is credited with first introducing the term 'Entrepreneur' in economic theory?", "options": ["Richard Cantillon", "John Maynard Keynes", "Karl Marx", "Milton Friedman"], "ans": 0, "exp": "Irish-French economist Richard Cantillon (18th century) ne pehli baar 'entrepreneur' term use kiya."}]}, {"id": "ie-framework-theories", "section": "ie", "title": "Framework of Entrepreneurship Theories", "priority": "High", "expectedQs": "1 Q", "definition": "Entrepreneurship theories ko 4 broad frameworks mein classify kiya jata hai: Economic, Psychological, Sociological, aur Resource-Based / Opportunity-Based theories.", "examFocus": "Classify karna aana chahiye: Economic (incentives/profits), Psychological (traits/locus of control), Sociological (culture/social networks), Resource-Based (financial/human/social capital).", "formulas": ["Economic Framework: Cantillon, Schumpeter, Kirzner (Alertness to opportunities)", "Psychological Framework: McClelland (n-Ach), Rotter (Internal Locus of Control)", "Sociological Framework: Max Weber, Everett Hagen (Status Withdrawal), Cochran", "Resource-Based Framework: Financial, Human, and Social Capital"], "examples": [{"q": "'Internal Locus of Control' (Julian Rotter) ka kya matlab hai?", "steps": "Step 1: Ye belief ki aapki success aapke khud ke actions/decisions par depend karti hai, luck par nahi."}, {"q": "Israel Kirzner ki theory kis cheez par focus karti hai?", "steps": "Step 1: 'Entrepreneurial Alertness' — market mein pehle se maujood unnoticed opportunities ko spot karna."}], "mcqs": [{"q": "Believing that your own actions and efforts determine success rather than luck is called:", "options": ["External Locus of Control", "Internal Locus of Control", "Status Withdrawal", "Creative Destruction"], "ans": 1, "exp": "Entrepreneurs mein high Internal Locus of Control hota hai."}, {"q": "Max Weber's theory of entrepreneurship belongs to which framework?", "options": ["Sociological / Cultural", "Pure Mathematical", "Financial Accounting", "Biological"], "ans": 0, "exp": "Max Weber ne social/cultural aur religious values ka entrepreneurship par impact bataya."}, {"q": "Who proposed the 'Entrepreneurial Alertness' theory?", "options": ["Israel Kirzner", "Max Weber", "Maslow", "Herzberg"], "ans": 0, "exp": "Israel Kirzner ne market alertness par focus kiya."}]}, {"id": "ie-models", "section": "ie", "title": "Models of Entrepreneurship", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Business Models jo batate hain startup paisa kaise kamata hai aur customers tak kaise pahunchta hai: B2B, B2C, D2C, SaaS, Freemium, Marketplace, Subscription, Franchise, aur Business Model Canvas.", "examFocus": "Alexander Osterwalder ka **Business Model Canvas (9 Building Blocks)** aur Freemium / SaaS / D2C / Aggregator models par direct case-based MCQs aate hain!", "formulas": ["Business Model Canvas (Osterwalder): 9 Blocks (Value Proposition, Customer Segments, Channels, Relationships, Revenue, Key Resources, Activities, Partners, Cost Structure)", "Freemium = Free basic version + Paid premium features (e.g., Spotify, Canva)", "D2C (Direct-to-Consumer) = Brand sells directly without middlemen (e.g., boAt, Mamaearth)", "Aggregator / Marketplace = Connects buyers & sellers without owning inventory (e.g., Uber, Zomato)"], "examples": [{"q": "Canva ya Spotify free basic plan dete hain aur extra features ke liye charge karte hain. Ye kaunsa business model hai?", "steps": "Step 1: Freemium model (Free + Premium)."}, {"q": "Business Model Canvas mein total kitne building blocks hote hain?", "steps": "Step 1: 9 building blocks (developed by Alexander Osterwalder)."}], "mcqs": [{"q": "How many building blocks are in Alexander Osterwalder's Business Model Canvas?", "options": ["5", "7", "9", "12"], "ans": 2, "exp": "Business Model Canvas mein 9 building blocks hote hain."}, {"q": "Offering a basic digital product for free while charging for advanced features is known as:", "options": ["Franchising", "Freemium Model", "B2G Model", "Drop-shipping"], "ans": 1, "exp": "Freemium = Free + Premium."}, {"q": "Uber aur Airbnb kis type ke business model ke best examples hain?", "options": ["Manufacturing", "Platform / Sharing Economy Aggregator", "Government Monopoly", "Brick-and-Mortar Wholesale"], "ans": 1, "exp": "Ye Asset-light Platform / Aggregator models hain."}]}, {"id": "ie-corporate", "section": "ie", "title": "Emerging Models of Corporate Entrepreneurship", "priority": "Medium", "expectedQs": "1 Q", "definition": "Jab badi established companies (Google, Tata, Reliance) apne andar startup-like innovation laati hain—Corporate Venturing, Intrapreneurship, Spin-offs, Hackathons, aur Open Innovation.", "examFocus": "Henry Chesbrough ka **Open Innovation** (bahar ke startups/universities se collaborate karna) aur **Corporate Venture Capital (CVC)** samajh lein.", "formulas": ["Open Innovation (Henry Chesbrough): Combining internal + external ideas & startups", "Corporate Venture Capital (CVC): Large firm investing equity directly in external startups", "Spin-off: Creating a separate independent company from an internal corporate project"], "examples": [{"q": "Jab koi badi company apne R&D project ko alag independent startup company bana de, toh use kya kehte hain?", "steps": "Step 1: Corporate Spin-off."}, {"q": "Open Innovation ka term kisne popularize kiya?", "steps": "Step 1: Henry Chesbrough (2003)."}], "mcqs": [{"q": "Who coined the term 'Open Innovation'?", "options": ["Henry Chesbrough", "Michael Porter", "Philip Kotler", "Peter Drucker"], "ans": 0, "exp": "Henry Chesbrough ne 2003 mein Open Innovation concept popular kiya."}, {"q": "When a large corporation invests directly in external startups for strategic growth, it is called:", "options": ["Bootstrapping", "Corporate Venture Capital (CVC)", "Microfinance", "Franchising"], "ans": 1, "exp": "Corporate Venture Capital (CVC)."}, {"q": "Internal innovation labs aur 20%-time projects (jaise Google ka Gmail) kis cheez ke examples hain?", "options": ["Corporate Entrepreneurship / Intrapreneurship", "Hostile Takeover", "Liquidation", "Outsourcing"], "ans": 0, "exp": "Ye Corporate Entrepreneurship (Intrapreneurship) ke classic examples hain."}]}, {"id": "ie-dimensions", "section": "ie", "title": "Dimensions of Entrepreneurship", "priority": "Medium", "expectedQs": "1 Q", "definition": "Entrepreneurial Orientation (EO) ke 5 core dimensions (Lumpkin & Dess): Innovativeness, Risk-taking, Proactiveness, Competitive Aggressiveness, aur Autonomy. Saath hi Types of Innovation (Disruptive, Incremental, Radical, Frugal/Jugaad).", "examFocus": "Clayton Christensen ka **Disruptive Innovation** aur **Frugal Innovation** (kam cost mein smart solution, jaise Tata Nano/UPI) par CMAT mein direct sawal aata hai.", "formulas": ["Disruptive Innovation (Clayton Christensen): Simpler, cheaper product disrupts established market", "Incremental Innovation: Small continuous improvements to existing product", "Frugal Innovation: High-value solution with minimal resources/cost", "5 EO Dimensions: Innovativeness, Risk-taking, Proactiveness, Autonomy, Competitive Aggressiveness"], "examples": [{"q": "Netflix ne DVD rental industry (Blockbuster) ko streaming se replace kar diya. Ye kis type ki innovation hai?", "steps": "Step 1: Disruptive Innovation (Clayton Christensen)."}, {"q": "Har saal smartphone camera mein thoda better megapixel add karna kis type ki innovation hai?", "steps": "Step 1: Incremental Innovation."}], "mcqs": [{"q": "The theory of 'Disruptive Innovation' was introduced by:", "options": ["Clayton Christensen", "Joseph Schumpeter", "Adam Smith", "Henry Fayol"], "ans": 0, "exp": "Harvard professor Clayton Christensen ne Disruptive Innovation theory di thi."}, {"q": "Designing affordable, high-value solutions under resource constraints (like UPI or portable ECG) is called:", "options": ["Frugal Innovation", "Monopoly", "Arbitrage", "Bureaucracy"], "ans": 0, "exp": "Frugal Innovation kam resources mein impactful solution create karti hai."}, {"q": "Small, step-by-step improvements to an existing product are known as:", "options": ["Radical Innovation", "Incremental Innovation", "Disruptive Innovation", "Social Innovation"], "ans": 1, "exp": "Existing product ko dhire-dhire upgrade karna Incremental Innovation hai."}]}, {"id": "ie-society", "section": "ie", "title": "Entrepreneurial Society", "priority": "Medium", "expectedQs": "1 Q", "definition": "Aisi society jahan innovation, lifelong learning, aur startup ecosystem (Incubators, Accelerators, Universities, IPR protection) ko actively support kiya jata hai—concept popularized by Peter Drucker.", "examFocus": "Incubator vs Accelerator ka farq aur Intellectual Property Rights (**Patent, Trademark, Copyright, Geographical Indication**) zaroor yaad rakhein!", "formulas": ["Incubator = Early-stage support (workspace, mentoring, longer duration) | Accelerator = Fixed-term (3–6 mo) intense growth + seed funding", "IPR: Patent (Inventions, 20 yrs) | Copyright (Creative/Code/Books) | Trademark (Brand Name/Logo) | GI Tag (Region-specific product, e.g., Gir Kesar Mango)"], "examples": [{"q": "Kisi company ke Logo aur Brand Name ko legally protect karne ke liye kya register kiya jata hai?", "steps": "Step 1: Trademark."}, {"q": "India mein ek granted Patent ki validity kitne saal hoti hai?", "steps": "Step 1: 20 years from the date of filing."}], "mcqs": [{"q": "Which Intellectual Property Right protects a company's brand logo and tagline?", "options": ["Patent", "Copyright", "Trademark", "Trade Secret"], "ans": 2, "exp": "Trademark brand name, logo, aur tagline ko protect karta hai."}, {"q": "What is the standard validity term of a Patent in India?", "options": ["10 years", "15 years", "20 years", "50 years"], "ans": 2, "exp": "India mein Patent filing date se 20 saal tak valid hota hai."}, {"q": "Software source code, books, aur music kis IPR ke under protect hote hain?", "options": ["Trademark", "Copyright", "GI Tag", "Industrial Design"], "ans": 1, "exp": "Literary, artistic works aur software source code Copyright ke under aate hain."}]}, {"id": "ie-culture", "section": "ie", "title": "Entrepreneurial Culture", "priority": "Medium", "expectedQs": "1 Q", "definition": "Organizational aur regional mindset jo experimentation, calculated risk-taking, 'fail fast & learn', aur flat hierarchy ko encourage karta hai (jaise Silicon Valley ya Bengaluru/Gujarat startup hubs).", "examFocus": "Bureaucratic culture (rigid rules, fear of failure) vs Entrepreneurial culture (agility, experimentation, customer-obsession) ka contrast clear rakhein.", "formulas": ["Core Traits: Tolerance for smart failure, Decentralised decisions, Customer obsession, Agility", "Design Thinking 5 Stages: Empathize → Define → Ideate → Prototype → Test"], "examples": [{"q": "Design Thinking process ka sabse pehla step kya hota hai?", "steps": "Step 1: Empathize (user ki real problem ko deeply samajhna)."}, {"q": "'Fail fast, learn faster' kis culture ka principle hai?", "steps": "Step 1: Lean Startup / Entrepreneurial Culture (Eric Ries)."}], "mcqs": [{"q": "What is the very first step in the 5-stage Design Thinking process?", "options": ["Prototype", "Ideate", "Empathize", "Test"], "ans": 2, "exp": "Order: Empathize → Define → Ideate → Prototype → Test."}, {"q": "Who authored the famous startup methodology book 'The Lean Startup'?", "options": ["Eric Ries", "Peter Thiel", "Steve Jobs", "Jeff Bezos"], "ans": 0, "exp": "Eric Ries ne 'The Lean Startup' (Build-Measure-Learn loop) likhi thi."}, {"q": "Entrepreneurial culture mein failure ko kis nazar se dekha jata hai?", "options": ["Permanent career end", "A learning feedback loop for iteration", "Strictly punishable", "Avoided by doing nothing"], "ans": 1, "exp": "Calculated failure ko learning aur product iteration ka hissa mana jata hai."}]}, {"id": "ie-rural", "section": "ie", "title": "Rural Entrepreneurship", "priority": "High", "expectedQs": "1 Q", "definition": "Gaon aur semi-urban areas mein local resources (agriculture, dairy, handicrafts, khadi, agro-processing) par based enterprises create karna—taaki rural-to-urban migration ruke.", "examFocus": "Key Indian institutions: **NABARD** (rural credit), **KVIC** (Khadi & Village Industries Commission), **Amul** (Gujarat's iconic rural dairy cooperative model), aur **ASPIRE** scheme.", "formulas": ["NABARD (1982): Apex bank for agriculture & rural development", "KVIC: Promotes Khadi & village industries (implements PMEGP scheme)", "ASPIRE Scheme: A Scheme for Promotion of Innovation, Rural Industries & Entrepreneurship (Ministry of MSME)"], "examples": [{"q": "Amul (Anand, Gujarat) rural entrepreneurship ke kis model ka world-famous example hai?", "steps": "Step 1: Cooperative Entrepreneurship Model (farmer-owned dairy cooperative)."}, {"q": "PMEGP (Prime Minister's Employment Generation Programme) ki nodal agency kaunsi hai?", "steps": "Step 1: KVIC (Khadi and Village Industries Commission)."}], "mcqs": [{"q": "Which apex institution provides refinance and support for rural development and agri-enterprises in India?", "options": ["SEBI", "NABARD", "TRAI", "IRDAI"], "ans": 1, "exp": "NABARD (National Bank for Agriculture and Rural Development, est. 1982)."}, {"q": "ASPIRE scheme by the Ministry of MSME specifically focuses on:", "options": ["Space rockets", "Innovation, Rural Industries & Entrepreneurship", "Aviation exports", "Crypto mining"], "ans": 1, "exp": "ASPIRE = A Scheme for Promotion of Innovation, Rural Industries & Entrepreneurship."}, {"q": "Amul (Gujarat) kis type ke rural enterprise model par chalta hai?", "options": ["Foreign Subsidiary", "Cooperative Model", "Public Sector Monopoly", "Franchise Only"], "ans": 1, "exp": "Amul ek 3-tier farmer Cooperative Model hai."}]}, {"id": "ie-women", "section": "ie", "title": "Women Entrepreneurship", "priority": "High", "expectedQs": "1 Q", "definition": "Aise enterprises jahan women initiate, organize, aur operate karti hain (Govt of India definition: minimum 51% financial interest/capital aur kam se kam 51% employment generated women ko).", "examFocus": "**Stand-Up India** (₹10L to ₹1 Cr loans for SC/ST & Women entrepreneurs), **Mahila E-Haat**, **WEP (Women Entrepreneurship Platform by NITI Aayog)**, aur famous Indian women founders (Falguni Nayar - Nykaa, Kiran Mazumdar-Shaw - Biocon, Vineeta Singh - Sugar, Ghazal Alagh - Mamaearth) yaad rakhein!", "formulas": ["Govt of India Definition: ≥ 51% equity ownership + ≥ 51% women employment", "Stand-Up India (2016): ₹10 Lakh to ₹1 Crore bank loan for Women & SC/ST greenfield enterprises", "Famous Indian Women Founders: Kiran Mazumdar-Shaw (Biocon), Falguni Nayar (Nykaa), Vandana Luthra (VLCC)"], "examples": [{"q": "Stand-Up India scheme mein kitne amount ka loan milta hai?", "steps": "Step 1: ₹10 Lakh se ₹1 Crore tak (kam se kam 1 SC/ST aur 1 Woman borrower per bank branch)."}, {"q": "Nykaa ki founder kaun hain?", "steps": "Step 1: Falguni Nayar."}], "mcqs": [{"q": "Stand-Up India scheme facilitates bank loans between ₹10 Lakh and ₹1 Crore specifically for:", "options": ["Large IT companies", "SC/ST and Women entrepreneurs", "Only exporters", "Foreign investors"], "ans": 1, "exp": "Stand-Up India SC/ST aur Women entrepreneurs ke greenfield projects ke liye hai."}, {"q": "Who is the founder of Biocon, one of India's pioneering biotech enterprises?", "options": ["Falguni Nayar", "Kiran Mazumdar-Shaw", "Indra Nooyi", "Roshni Nadar"], "ans": 1, "exp": "Kiran Mazumdar-Shaw ne Biocon (1978) establish ki thi."}, {"q": "Women Entrepreneurship Platform (WEP) kis organization ne launch kiya hai?", "options": ["NITI Aayog", "RBI", "AICTE", "ISRO"], "ans": 0, "exp": "NITI Aayog ne WEP launch kiya hai."}]}, {"id": "ie-social", "section": "ie", "title": "Emerging Trends in Social Entrepreneurship", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Social Entrepreneurship business models ko use karke social/environmental problems (education, healthcare, clean water, microfinance) solve karti hai—jahan success 'Triple Bottom Line' (People, Planet, Profit) se measure hoti hai.", "examFocus": "**Triple Bottom Line (3Ps)**, **Muhammad Yunus (Grameen Bank — Microfinance)**, **SEWA (Ela Bhatt, Ahmedabad)**, **Aravind Eye Care**, aur **CSR (2% of avg net profit under Companies Act 2013)** 100% yaad rakhein!", "formulas": ["Triple Bottom Line (John Elkington): People (Social), Planet (Environmental), Profit (Economic)", "CSR Rule (Companies Act 2013, Sec 135): Eligible firms spend ≥ 2% of avg 3-year net profits on CSR", "Icons: Muhammad Yunus (Grameen Bank), Ela Bhatt (SEWA, Gujarat), Bunker Roy (Barefoot College)"], "examples": [{"q": "'Triple Bottom Line' ke 3 Ps kya hain?", "steps": "Step 1: People, Planet, and Profit."}, {"q": "SEWA (Self Employed Women's Association) Ahmedabad mein kisne establish ki thi?", "steps": "Step 1: Ela Bhatt (1972)."}], "mcqs": [{"q": "The 'Triple Bottom Line' framework measures performance across which three dimensions?", "options": ["Price, Place, Promotion", "People, Planet, Profit", "Product, Process, Policy", "Power, Prestige, Profit"], "ans": 1, "exp": "3Ps = People, Planet, Profit (coined by John Elkington)."}, {"q": "Who founded Grameen Bank and pioneered microfinance, winning the Nobel Peace Prize?", "options": ["Amartya Sen", "Muhammad Yunus", "Raghuram Rajan", "Abhijit Banerjee"], "ans": 1, "exp": "Prof. Muhammad Yunus ne Bangladesh mein Grameen Bank shuru kiya."}, {"q": "Under India's Companies Act 2013, eligible companies must spend at least what % of average net profit on CSR?", "options": ["1%", "2%", "5%", "10%"], "ans": 1, "exp": "Section 135 mandates at least 2% of average net profits of the preceding 3 financial years."}]}, {"id": "ie-business-org", "section": "ie", "title": "Principles of Business Organisation", "priority": "High", "expectedQs": "1-2 Qs", "definition": "Business ownership structures (Sole Proprietorship, Partnership, LLP, Private Limited, Public Limited, OPC) aur Henry Fayol ke 14 Principles of Management + SWOT/PESTLE analysis.", "examFocus": "Limited vs Unlimited Liability, **OPC (One Person Company)**, **LLP**, aur **SWOT** (Internal: S, W | External: O, T) + **4Ps of Marketing** par direct questions aate hain.", "formulas": ["Sole Proprietorship & Partnership = Unlimited Liability | Pvt Ltd, Public Ltd, LLP, OPC = Limited Liability", "SWOT: Strengths & Weaknesses (Internal) | Opportunities & Threats (External)", "4Ps of Marketing (McCarthy): Product, Price, Place, Promotion", "Fayol Key Principles: Division of Work, Unity of Command (1 boss), Scalar Chain, Esprit de Corps (team spirit)"], "examples": [{"q": "SWOT analysis mein 'Opportunities' aur 'Threats' internal factors hain ya external?", "steps": "Step 1: External factors (market/environment se aate hain); S & W internal hote hain."}, {"q": "Henry Fayol ke 'Unity of Command' principle ka kya matlab hai?", "steps": "Step 1: Har employee ko sirf EK hi superior (boss) se orders milne chahiye."}], "mcqs": [{"q": "In which form of business organization does the owner have UNLIMITED personal liability?", "options": ["Private Limited Company", "LLP", "Sole Proprietorship", "One Person Company"], "ans": 2, "exp": "Sole Proprietorship aur traditional Partnership mein liability unlimited hoti hai."}, {"q": "In SWOT analysis, 'Weaknesses' are classified as:", "options": ["External positive", "Internal negative", "External negative", "Internal positive"], "ans": 1, "exp": "Strengths function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      if (Array.isArray(saved.completedTopics)) state.completedTopics = saved.completedTopics;
      if (Array.isArray(saved.solvedPyqs)) state.solvedPyqs = saved.solvedPyqs;
      if (Array.isArray(saved.checkedPlan)) state.checkedPlan = saved.checkedPlan;
      if (Array.isArray(saved.mockHistory)) state.mockHistory = saved.mockHistory;
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      completedTopics: state.completedTopics,
      solvedPyqs: state.solvedPyqs,
      checkedPlan: state.checkedPlan,
      mockHistory: state.mockHistory
    }));
  } catch (e) {}
}

function showToast(msg) {
  const el = document.getElementById('toastBox');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
}

function esc(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function getDaysLeft() {
  const exam = new Date('2027-02-11T09:00:00+05:30');
  const now = new Date();
  const diff = Math.ceil((exam - now) / (1000 * 60 * 60 * 24));
  return diff > 0 ? diff : 0;
}

function getSecMeta(secId) {
  return SECTIONS.find(s => s.id === secId) || SECTIONS[0];
}

function prioBadge(p) {
  if (p === 'Very High') return '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-rose-100 text-rose-800">Very High</span>';
  if (p === 'High') return '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800">High</span>';
  return '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-700">Medium</span>';
}

function updateNav() {
  document.getElementById('navProgressText').textContent = `${state.completedTopics.length} / ${TOPICS.length} Mastered`;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const active = btn.dataset.nav === state.activeTab;
    btn.className = `nav-btn px-3.5 py-1.5 rounded-lg text-sm font-semibold transition ${active ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`;

}

// ================= RENDER 78 TOPICS SYLLABUS =================
function renderSyllabus() {
  const filtered = TOPICS.filter(t => {
    if (state.secFilter !== 'all' && t.section !== state.secFilter) return false;
    if (state.prioFilter !== 'all' && t.priority !== state.prioFilter) return false;
    const isDone = state.completedTopics.includes(t.id);
    if (state.statusFilter === 'done' && !isDone) return false;
    if (state.statusFilter === 'pending' && isDone) return false;
    if (state.search.trim()) {
      const q = state.search.toLowerCase();
      return t.title.toLowerCase().includes(q) || t.definition.toLowerCase().includes(q);
    }
    return true;
  });

  return `
    <div class="space-y-6">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Complete A-to-Z Syllabus (78 Topics)</h1>
          <p class="text-sm text-slate-500 mt-1">Kisi bhi topic par click karein — uska pura dedicated study page (Concept, Formulas, Solved Examples, MCQs &amp; Mini Test) khul jayega.</p>
        </div>
        <a href="https://drive.google.com/file/d/1KfNW759RzVBm29dKMBM88HsTXudp1gEC/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-slate-200 hover:border-indigo-400 text-xs font-semibold text-indigo-700 shadow-sm">
          <i data-lucide="file-text" class="w-4 h-4"></i> Open Official CMAT-Syllabus-2027.pdf
        </a>
      </div>

      <!-- FILTERS -->
      <div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
        <div class="flex flex-wrap gap-2">
          <button type="button" data-sec-filter="all" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${state.secFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">All Sections (78)</button>
          ${SECTIONS.map(s => {
            const cnt = TOPICS.filter(t => t.section === s.id).length;
            const act = state.secFilter === s.id;
            return `<button type="button" data-sec-filter="${s.id}" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${act ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">${s.short} (${cnt})</button>`;
          }).join('')}
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <input type="text" id="topicSearchInput" value="${esc(state.search)}" placeholder="Search topic (e.g., Percentages, Syllogisms, Schumpeter)..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <select id="prioSelect" class="px-3.5 py-2 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="all" ${state.prioFilter==='all'?'selected':''}>All Priorities</option>
            <option value="Very High" ${state.prioFilter==='Very High'?'selected':''}>Very High Priority</option>
            <option value="High" ${state.prioFilter==='High'?'selected':''}>High Priority</option>
            <option value="Medium" ${state.prioFilter==='Medium'?'selected':''}>Medium Priority</option>
          </select>
          <select id="statusSelect" class="px-3.5 py-2 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="all" ${state.statusFilter==='all'?'selected':''}>All Status (${TOPICS.length})</option>
            <option value="pending" ${state.statusFilter==='pending'?'selected':''}>Pending Only</option>
            <option value="done" ${state.statusFilter==='done'?'selected':''}>Mastered Only (${state.completedTopics.length})</option>
          </select>
        </div>
      </div>

      <!-- TOPIC CARDS GRID -->
      <div class="text-xs font-semibold text-slate-500">Showing ${filtered.length} of ${TOPICS.length} topics</div>
      ${filtered.length === 0 ? `
        <div class="bg-white border border-slate-200 rounded-2xl p-10 text-center text-slate-500 text-sm">
          Koi topic match nahi hua. Search ya filter clear karke dekhein.
        </div>
      ` : `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${filtered.map(t => {
            const sm = getSecMeta(t.section);
            const done = state.completedTopics.includes(t.id);
            return `
              <div class="bg-white border ${done ? 'border-emerald-300 bg-emerald-50/30' : 'border-slate-200'} hover:border-indigo-400 hover:shadow-md rounded-2xl p-4 transition flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${sm.badgeBg}">${sm.short}</span>

                </div>

            `;
          }).join('')}
        </div>
      `}
    </div>

}

function renderTopicModal() {
  const modal = document.getElementById('topicModal');

  if (!state.openTopicId) {
    modal.classList.add('hidden');
    return;
  }
  modal.classList.remove('hidden');

  const idx = TOPICS.findIndex(t => t.id === state.openTopicId);
  const t = TOPICS[idx];
  const sm = getSecMeta(t.section);
  const done = state.completedTopics.includes(t.id);
  const prevTopic = idx > 0 ? TOPICS[idx - 1] : null;
  const nextTopic = idx < TOPICS.length - 1 ? TOPICS[idx + 1] : null;

  let bodyHtml = '';
  if (state.topicSubTab === 'concept') {
    bodyHtml = `
      <div class="space-y-5">
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5">
          <h3 class="text-sm font-bold uppercase tracking-wide text-indigo-700 mb-2">A-to-Z Concept &amp; Definition</h3>
          <p class="text-slate-800 text-sm sm:text-base leading-relaxed">${esc(t.definition)}</p>
        </div>
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5">
          <h3 class="text-sm font-bold uppercase tracking-wide text-amber-800 mb-2">CMAT Exam Focus &amp; Common Traps</h3>

        </div>
        <div class="flex flex-wrap gap-3 pt-2">
          <button type="button" data-topic-tab="formulas" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">Next: Formulas &amp; Shortcuts →</button>
          <button type="button" data-topic-tab="practice" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm font-semibold">Jump to Practice MCQs</button>
        </div>
      </div>
    `;
  } else if (state.topicSubTab === 'formulas') {
    bodyHtml = `
      <div class="space-y-4">
        <h3 class="text-base font-bold text-slate-900">Key Formulas, Rules &amp; Shortcuts</h3>
        <div class="space-y-2.5">
          ${t.formulas.map((f, i) => `
            <div class="flex items-start gap-3 bg-indigo-50/60 border border-indigo-100 rounded-xl p-3.5">
              <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span>
              <div class="text-sm text-slate-800 font-medium leading-relaxed">${esc(f)}</div>
            </div>
          `).join('')}
        </div>
        <div class="pt-2">
          <button type="button" data-topic-tab="examples" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">Next: Solved Examples →</button>
        </div>
      </div>
    `;
  } else if (state.topicSubTab === 'examples') {
    bodyHtml = `
      <div class="space-y-4">
        <h3 class="text-base font-bold text-slate-900">Step-by-Step Worked Examples</h3>
        ${t.examples.map((ex, i) => `
          <div class="border border-slate-200 rounded-2xl overflow-hidden">
            <div class="bg-slate-50 px-4 py-3 border-b border-slate-200">
              <span class="text-xs font-bold uppercase text-indigo-700">Example ${i + 1}</span>
              <div class="font-semibold text-slate-900 text-sm sm:text-base mt-1">${esc(ex.q)}</div>
            </div>
            <div class="p-4 bg-white">
              <div class="text-xs font-bold uppercase text-emerald-700 mb-1.5">Solution</div>
              <div class="text-sm text-slate-700 whitespace-pre-line leading-relaxed">${esc(ex.steps)}</div>
            </div>
          </div>
        `).join('')}
        <div class="pt-2">
          <button type="button" data-topic-tab="practice" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">Next: Practice MCQs &amp; Mini Test →</button>
        </div>
      </div>
    `;
  } else if (state.topicSubTab === 'practice') {
    let correct = 0, wrong = 0;
    t.mcqs.forEach((m, qi) => {
      const key = `${t.id}_${qi}`;
      if (state.topicPracticeAnswers[key] !== undefined) {
        if (state.topicPracticeAnswers[key] === m.ans) correct++;
        else wrong++;
      }
    });
    const score = correct * 4 - wrong;

    bodyHtml = `
      <div class="space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900 text-white rounded-2xl p-4">
          <div>
            <div class="text-xs text-indigo-300 font-semibold">Topic Practice Score (NTA +4 / −1)</div>
            <div class="text-xl font-extrabold">${score} Marks <span class="text-xs font-medium text-slate-300">(${correct} Correct · ${wrong} Wrong)</span></div>
          </div>
          <div class="flex gap-2">
            <button type="button" id="resetTopicPracticeBtn" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold">Reset Answers</button>
            <button type="button" id="startTopicTestBtn" class="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-white text-xs font-semibold">Start Timed Mini Test</button>
          </div>
        </div>

        ${t.mcqs.map((m, qi) => {
          const key = `${t.id}_${qi}`;
          const chosen = state.topicPracticeAnswers[key];
          const answered = chosen !== undefined;
          return `
            <div class="border border-slate-200 rounded-2xl p-4 sm:p-5 space-y-3">
              <div class="font-semibold text-slate-900 text-sm sm:text-base">Q${qi + 1}. ${esc(m.q)}</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${m.options.map((opt, oi) => {
                  let cls = 'border-slate-200 hover:border-indigo-400 bg-white text-slate-800';
                  if (answered) {
                    if (oi === m.ans) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
                    else if (oi === chosen) cls = 'border-rose-500 bg-rose-50 text-rose-900';
                    else cls = 'border-slate-100 bg-slate-50 text-slate-400';
                  }
                  return `
                    <button type="button" data-mcq-topic="${t.id}" data-mcq-qi="${qi}" data-mcq-oi="${oi}" class="text-left px-3.5 py-2.5 rounded-xl border text-sm transition ${cls}">
                      <span class="font-bold mr-1.5">${String.fromCharCode(65 + oi)}.</span> ${esc(opt)}
                    </button>
                  `;
                }).join('')}
              </div>
              ${answered ? `
                <div class="text-xs sm:text-sm p-3 rounded-xl ${chosen === m.ans ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-50 text-rose-900 border border-rose-200'}">
                  <strong>${chosen === m.ans ? 'Sahi (+4)!' : 'Galat (−1).'}</strong> ${esc(m.exp)}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  card.innerHTML = `
    <div class="bg-slate-900 text-white px-5 py-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2 text-xs mb-1">
          <span class="px-2 py-0.5 rounded-full font-bold ${sm.badgeBg}">${sm.name}</span>
          <span class="text-slate-300">Expected: ${esc(t.expectedQs)}</span>
          ${prioBadge(t.priority)}
        </div>
        <h2 class="text-lg sm:text-2xl font-extrabold truncate">${esc(t.title)}</h2>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" id="toggleMasterBtn" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${done ? 'bg-emerald-500 text-white' : 'bg-white/10 hover:bg-white/20 text-white border border-white/20'}">
          ${done ? '✓ Mastered' : 'Mark Mastered'}
        </button>
        <button type="button" id="closeTopicModalBtn" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white" aria-label="Close">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <div class="border-b border-slate-200 px-5 pt-3 flex gap-1 overflow-x-auto bg-slate-50">
      ${[
        ['concept', '1. Concept & A–Z'],
        ['formulas', '2. Formulas & Shortcuts'],
        ['examples', '3. Solved Examples'],
        ['practice', '4. Practice MCQs & Test']
      ].map(([id, label]) => `
        <button type="button" data-topic-tab="${id}" class="px-4 py-2.5 text-xs sm:text-sm font-semibold border-b-2 whitespace-nowrap transition ${state.topicSubTab === id ? 'border-indigo-600 text-indigo-700 bg-white rounded-t-lg' : 'border-transparent text-slate-600 hover:text-slate-900'}">${label}</button>
      `).join('')}
    </div>

    <div class="p-5 sm:p-6">${bodyHtml}</div>

    <div class="bg-slate-50 border-t border-slate-200 px-5 py-3.5 flex items-center justify-between gap-2">
      ${prevTopic ? `<button type="button" data-open-topic="${prevTopic.id}" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-xs font-semibold text-slate-700">← ${esc(prevTopic.title)}</button>` : '<span></span>'}
      <span class="text-xs text-slate-500 font-medium">Topic ${idx + 1} of ${TOPICS.length}</span>
      ${nextTopic ? `<button type="button" data-open-topic="${nextTopic.id}" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold text-white">${esc(nextTopic.title)} →</button>` : '<span></span>'}
    </div>
  `;
  if (window.lucide) window.lucide.createIcons();
}

// ================= RENDER MOCK TEST ARENA =================
function startMockSession(sectionFilter, count, customTopicId = null) {
  clearInterval(window._mockTimer);
  let pool = [];
  TOPICS.forEach(t => {
    if (customTopicId && t.id !== customTopicId) return;
    if (!customTopicId && sectionFilter !== 'all' && t.section !== sectionFilter) return;
    t.mcqs.forEach(m => {
      pool.push({ ...m, topicTitle: t.title, section: t.section });
    });
  });
  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const qs = pool.slice(0, Math.min(count, pool.length));
  const durationSec = customTopicId ? 180 : qs.length * 90;

  state.mockSession = {
    label: customTopicId ? `Mini Test: ${qs[0].topicTitle}` : (sectionFilter === 'all' ? `Mixed All-5-Sections CBT (${qs.length} Qs)` : `${getSecMeta(sectionFilter).name} (${qs.length} Qs)`),
    qs,
    curr: 0,
    answers: {},
    marked: {},
    timeLeft: durationSec,
    submitted: false
  };
  state.openTopicId = null;
  state.activeTab = 'mock';
  renderAll();
  window._mockTimer = setInterval(() => {
    if (!state.mockSession || state.mockSession.submitted) {
      clearInterval(window._mockTimer);
      return;
    }
    state.mockSession.timeLeft--;
    const tEl = document.getElementById('mockTimerDisplay');
    if (tEl) tEl.textContent = formatTime(state.mockSession.timeLeft);
    if (state.mockSession.timeLeft <= 0) {
      submitMockSession();
    }
  }, 1000);
}

function formatTime(sec) {
  const m = Math.floor(Math.max(0, sec) / 60);
  const s = Math.max(0, sec) % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function submitMockSession() {
  if (!state.mockSession || state.mockSession.submitted) return;
  clearInterval(window._mockTimer);
  state.mockSession.submitted = true;
  let correct = 0, wrong = 0;
  state.mockSession.qs.forEach((q, i) => {
    if (state.mockSession.answers[i] !== undefined) {
      if (state.mockSession.answers[i] === q.ans) correct++;
      else wrong++;
    }
  });
  const score = correct * 4 - wrong;
  const maxScore = state.mockSession.qs.length * 4;
  const acc = (correct + wrong) > 0 ? Math.round((correct / (correct + wrong)) * 100) : 0;
  state.mockHistory.unshift({
    date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }),
    label: state.mockSession.label,
    score,
    maxScore,
    acc
  });
  if (state.mockHistory.length > 10) state.mockHistory.pop();
  saveState();
  renderAll();
}

function renderAll() {

  else if (state.activeTab === 'syllabus') main.innerHTML = renderSyllabus();
  else if (state.activeTab === 'plan') main.innerHTML = renderPlan();
  else if (state.activeTab === 'mock') main.innerHTML = renderMock();
  else if (state.activeTab === 'resources') main.innerHTML = renderResources();
  renderTopicModal();
